
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticker Mania | Account</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-width: 0;
  min-height: 100svh;
  overflow-x: hidden;
  background: #090515;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 16px clamp(12px, 3vw, 20px);
  background: #180c2b;
  border-bottom: 2px solid #a635f2;
}

header h1 {
  margin: 0;
  font-size: clamp(16px, 3vw, 22px);
}

button, .button {
  background: #d837f2;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 12px 20px;
  cursor: pointer;
  font-weight: bold;
  text-decoration: none;
}

button:hover, .button:hover {
  background: #b82bd4;
}

main {
  width: min(900px, calc(100% - 24px));
  margin: clamp(12px, 4vw, 40px) auto;
}

.account-panel {
  background: #211035;
  border: 2px solid #bd3aff;
  border-radius: 18px;
  padding: clamp(12px, 3vw, 25px);
  margin-bottom: clamp(12px, 3vw, 25px);
}

.account-panel h2 {
  margin-top: 0;
}

.profile {
  display: flex;
  align-items: center;
  gap: 15px;
  min-width: 0;
}
.profile > div { min-width: 0; }

.avatar {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  object-fit: cover;
  background: #432060;
}

.username {
  font-size: 22px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.account-id {
  font-size: 12px;
  color: #bba9ce;
  overflow-wrap: anywhere;
  margin-top: 6px;
}

.capsule-types {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin: 16px 0 28px;
}
.capsule-stat {
  min-width: 0;
  padding: 13px 8px;
  border: 1px solid rgba(166,84,230,.6);
  border-radius: 14px;
  background: linear-gradient(180deg, #25103d, #10091e);
  text-align: center;
}
.capsule-stat.common { --tier-color: #30e8fb; }
.capsule-stat.rare { --tier-color: #e946f6; }
.capsule-stat.legendary { --tier-color: #ffc936; }
.capsule-art {
  width: min(100%, 116px);
  aspect-ratio: 1;
  margin: 0 auto 9px;
  background-image: url("assets/zcety.png");
  background-size: 300% auto;
  background-repeat: no-repeat;
  background-position-y: top;
  border-radius: 50%;
  filter: drop-shadow(0 0 11px var(--tier-color));
}
.capsule-stat.common .capsule-art { background-position-x: left; }
.capsule-stat.rare .capsule-art { background-position-x: center; }
.capsule-stat.legendary .capsule-art { background-position-x: right; }
.capsule-tier {
  color: var(--tier-color);
  font-weight: 800;
  font-size: 13px;
  letter-spacing: .06em;
}
.capsule-quantity {
  margin-top: 5px;
  font-size: 17px;
  color: #fff;
  font-weight: bold;
}
.collection-heading {
  margin: 20px 0 12px;
  font-size: 19px;
  color: #f2dcff;
}
.sticker-artwork {
  display: grid;
  place-items: center;
  width: 100%;
  aspect-ratio: 1;
  margin-bottom: 10px;
  border-radius: 9px;
  overflow: hidden;
  border: 1px solid rgba(168,76,210,.45);
  background: linear-gradient(145deg, #432266, #1b1038 60%, #073944);
}
.sticker-artwork img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.sticker-no-art {
  padding: 10px;
  color: #c9aed8;
  font-size: 11px;
  line-height: 1.5;
  font-weight: bold;
  text-align: center;
}
.collection {
  min-height: 180px;
  border: 2px dashed #683c87;
  border-radius: 12px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr));
  align-content: start;
  gap: 12px;
  color: #bba9ce;
  padding: 20px;
}

.collection-empty {
  grid-column: 1 / -1;
  text-align: center;
  align-self: center;
}

.sticker-item {
  padding: 14px;
  border: 1px solid #843bac;
  border-radius: 10px;
  background: #170a29;
  color: #fff;
  text-align: center;
  overflow-wrap: anywhere;
}

.sticker-item strong {
  display: block;
  margin: 9px 0;
  font-size: 15px;
}

.sticker-type {
  font-size: 11px;
  color: #64ffcb;
  font-weight: bold;
}

.sticker-date {
  margin-top: 9px;
  font-size: 11px;
  color: #bba9ce;
}

.sticker-item img {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  object-fit: contain;
  border-radius: 6px;
}

.status {
  color: #ff9cdd;
  margin-top: 15px;
}

.actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.hidden {
  display: none;
}

@media (max-width: 600px) {
  header { gap: 10px; padding: 12px; }
  header .button { padding: 9px 11px; font-size: 11px; text-align: center; }
  .account-panel { border-radius: 12px; }
  .avatar { width: 52px; height: 52px; flex: 0 0 52px; }
  .username { font-size: 17px; }
  .account-id { font-size: 10px; }
  .collection { padding: 10px; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .sticker-item { padding: 9px; }
  .sticker-item strong { font-size: 12px; }
  .capsule-types { gap: 6px; margin: 10px 0 20px; }
  .capsule-stat { padding: 8px 4px; border-radius: 9px; }
  .capsule-art { width: min(100%, 76px); margin-bottom: 5px; }
  .capsule-tier { font-size: 10px; }
  .capsule-quantity { font-size: 13px; }
  .collection-heading { font-size: 16px; }
  .sticker-no-art { font-size: 9px; }
  #collection-totals { font-size: 12px; line-height: 1.5; }
}
@media (max-width: 320px) {
  .collection { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>

<body>

<header>
  <h1>STICKER MANIA</h1>
  <a class="button" href="index.html">BACK TO MACHINE</a>
</header>

<main>

  <!-- ACCOUNT -->
  <section class="account-panel">

    <h2>MY ACCOUNT</h2>

    <div id="loading">
      Checking Discord session...
    </div>

    <div id="profile" class="profile hidden">

      <img
        id="avatar"
        class="avatar"
        alt="Discord Avatar"
      >

      <div>
        <div id="username" class="username"></div>
        <div id="account-id" class="account-id"></div>
      </div>

    </div>

    <p id="status" class="status"></p>

    <div class="actions">
      <button id="signin" class="hidden">
        SIGN IN WITH DISCORD
      </button>

      <button id="signout" class="hidden">
        SIGN OUT
      </button>
    </div>

  </section>

  <!-- COLLECTION -->
  <section class="account-panel">

    <h2>MY COLLECTION</h2>
    <h3 class="collection-heading">CAPSULES OPENED <span id="collection-totals"></span></h3>
    <div class="capsule-types" id="capsule-types" aria-label="Capsule types opened">
      <div class="capsule-stat common">
        <div class="capsule-art" role="img" aria-label="Common capsule"></div>
        <div class="capsule-tier">COMMON</div>
        <div class="capsule-quantity" id="opened-common">—</div>
      </div>
      <div class="capsule-stat rare">
        <div class="capsule-art" role="img" aria-label="Rare capsule"></div>
        <div class="capsule-tier">RARE</div>
        <div class="capsule-quantity" id="opened-rare">—</div>
      </div>
      <div class="capsule-stat legendary">
        <div class="capsule-art" role="img" aria-label="Legendary capsule"></div>
        <div class="capsule-tier">LEGENDARY</div>
        <div class="capsule-quantity" id="opened-legendary">—</div>
      </div>
    </div>

    <h3 class="collection-heading">OWNED STICKERS</h3>
    <div class="collection" id="collection">
      Your collected items will appear here.
    </div>

  </section>

</main>

<script>

// ========================================
// SUPABASE
// ========================================

const SUPABASE_URL =
  "https://jqvnrdjrkdjgjbmqmbbl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_jmEahTk4OssD_IrOZq_6iQ_P6QFFJr6";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

// ========================================
// ELEMENTS
// ========================================

const loading = document.getElementById("loading");
const profile = document.getElementById("profile");
const avatar = document.getElementById("avatar");
const username = document.getElementById("username");
const accountId = document.getElementById("account-id");
const status = document.getElementById("status");
const signin = document.getElementById("signin");
const signout = document.getElementById("signout");
const collection = document.getElementById("collection");
const collectionTotals = document.getElementById("collection-totals");
const capsuleCountFields = {
  common: document.getElementById("opened-common"),
  rare: document.getElementById("opened-rare"),
  legendary: document.getElementById("opened-legendary")
};

function setCapsuleBreakdown(purchases) {
  const counts = { common: 0, rare: 0, legendary: 0 };
  const seen = new Set();
  for (const purchase of purchases) {
    if (seen.has(purchase.id)) continue;
    seen.add(purchase.id);
    if (Object.prototype.hasOwnProperty.call(counts, purchase.tier)) {
      counts[purchase.tier] += 1;
    }
  }
  for (const tier of Object.keys(counts)) {
    capsuleCountFields[tier].textContent = counts[tier].toLocaleString() + " opened";
  }
  collectionTotals.textContent = "(" + seen.size + ")";
}

function resetCapsuleBreakdown() {
  collectionTotals.textContent = "";
  for (const field of Object.values(capsuleCountFields)) {
    field.textContent = "—";
  }
}
let activeCollectionUser = null;
let collectionLoadVersion = 0;

function collectionMessage(message) {
  collection.replaceChildren();
  const note = document.createElement("div");
  note.className = "collection-empty";
  note.textContent = message;
  collection.append(note);
}

function makeStickerCard(purchase, capsule) {
  const card = document.createElement("article");
  card.className = "sticker-item";
  const info = capsule?.reward_data || {};
  const artwork = info.image_url || info.image || info.art_url ||
    info.sticker_url || info.image_path || info.media?.url;
  const artBox = document.createElement("div");
  artBox.className = "sticker-artwork";
  if (typeof artwork === "string" &&
      (/^https:\/\//i.test(artwork) || /^assets\/[a-z0-9_./-]+$/i.test(artwork))) {
    const img = document.createElement("img");
    img.src = artwork;
    img.alt = capsule.reward_name || "Sticker";
    img.loading = "lazy";
    img.onerror = () => {
      artBox.replaceChildren();
      const note = document.createElement("span");
      note.className = "sticker-no-art";
      note.textContent = "STICKER ARTWORK UNAVAILABLE";
      artBox.append(note);
    };
    artBox.append(img);
  } else {
    const note = document.createElement("span");
    note.className = "sticker-no-art";
    note.textContent = "STICKER ARTWORK NOT ADDED";
    artBox.append(note);
  }
  card.append(artBox);

  const label = document.createElement("div");
  label.className = "sticker-type";
  label.textContent = (purchase.tier || "Sticker").toUpperCase();

  const name = document.createElement("strong");
  name.textContent = capsule?.reward_name || "Collected sticker";

  const date = document.createElement("div");
  date.className = "sticker-date";
  date.textContent = purchase.paid_at
    ? "Collected " + new Date(purchase.paid_at).toLocaleDateString()
    : "Collected";

  card.append(label, name, date);
  return card;
}

// Capsule purchases are the ownership ledger: one paid purchase = one item.
async function loadCollection(user) {
  const id = user.id;
  const loadVersion = ++collectionLoadVersion;
  activeCollectionUser = id;
  collectionMessage("Loading your stickers...");

  try {
    const { data: session } = await client.auth.getSession();
    const token = session?.session?.access_token;
    if (!token) throw new Error("No Discord session");

    // Read only this user's successful purchases. The table's RLS also
    // enforces ownership; pending/expired attempts never enter collections.
    const purchases = [];
    for (let from = 0; ; from += 100) {
      const { data, error } = await client
        .from("capsule_purchases")
        .select("id, tier, paid_at")
        .eq("player_id", id)
        .in("status", ["paid", "fulfilled"])
        .order("paid_at", { ascending: false })
        .range(from, from + 99);
      if (error) throw error;
      purchases.push(...(data || []));
      if (!data || data.length < 100) break;
    }

    if (activeCollectionUser !== id || loadVersion !== collectionLoadVersion) return;
    setCapsuleBreakdown(purchases);
    if (!purchases.length) {
      collectionMessage("No stickers collected yet.");
      return;
    }

    const cards = [];
    const seenPurchaseIds = new Set();
    for (const purchase of purchases) {
      if (seenPurchaseIds.has(purchase.id)) continue;
      seenPurchaseIds.add(purchase.id);
      if (activeCollectionUser !== id || loadVersion !== collectionLoadVersion) return;
      // Reuse the authenticated verifier's existing completed-purchase
      // lookup, avoiding new tables, public capsule reads or extra functions.
      try {
        const { data, error } = await client.functions.invoke("verify-capsule", {
          method: "POST",
          body: { purchaseId: purchase.id },
          headers: { Authorization: "Bearer " + token }
        });
        if (error || !data || data.error || !data.capsule) {
          console.error("[COLLECTION] Sticker lookup failed", purchase.id, error || data?.error);
          continue;
        }
        if (activeCollectionUser !== id || loadVersion !== collectionLoadVersion) return;
        if (data.capsule.reward_type === "sticker") {
          cards.push(makeStickerCard(purchase, data.capsule));
        }
      } catch (error) {
        console.error("[COLLECTION] Sticker lookup failed", error);
      }
    }

    if (activeCollectionUser !== id || loadVersion !== collectionLoadVersion) return;
    if (cards.length) {
      collection.replaceChildren(...cards);
    } else {
      collectionMessage("Your collection could not be loaded. Please try again.");
    }
  } catch (error) {
    console.error("[COLLECTION]", error);
    if (activeCollectionUser === id && loadVersion === collectionLoadVersion) {
      collectionMessage("Your collection could not be loaded. Please try again.");
    }
  }
}

// ========================================
// DISPLAY ACCOUNT
// ========================================

function showAccount(user) {

  loading.classList.add("hidden");
  profile.classList.remove("hidden");

  signin.classList.add("hidden");
  signout.classList.remove("hidden");

  const metadata = user.user_metadata || {};

  username.textContent =
    metadata.global_name ||
    metadata.preferred_username ||
    metadata.user_name ||
    metadata.full_name ||
    metadata.name ||
    "Discord User";

  accountId.textContent = "Account: " + user.id;

  const avatarUrl = metadata.avatar_url;

  if (avatarUrl) {
    avatar.src = avatarUrl;
    avatar.classList.remove("hidden");
  } else {
    avatar.removeAttribute("src");
    avatar.classList.add("hidden");
  }

  resetCapsuleBreakdown();
  collectionMessage("Loading your stickers...");
}

// ========================================
// NO SESSION
// ========================================

function showSignedOut() {

  loading.classList.add("hidden");
  profile.classList.add("hidden");

  signin.classList.remove("hidden");
  signout.classList.add("hidden");

  status.textContent =
    "Sign in with Discord to access your account.";

  activeCollectionUser = null;
  ++collectionLoadVersion;
  resetCapsuleBreakdown();
  collectionMessage("Sign in to view your collection.");
}

// ========================================
// CHECK SESSION
// ========================================

async function loadAccount() {

  const { data, error } = await client.auth.getUser();

  if (error || !data.user) {
    showSignedOut();
    return;
  }

  const user = data.user;

  showAccount(user);
  void loadCollection(user);

  // Read the account created by index.html.
  const { data: account, error: accountError } =
    await client
      .from("sticker_accounts")
      .select("id, discord_id, username, capsules_opened, stickers_owned")
      .eq("id", user.id)
      .maybeSingle();

  if (accountError) {

    status.textContent =
      "Account lookup failed: " + accountError.message;

    return;
  }

  if (account) {
    username.textContent =
      account.username || username.textContent;

    status.textContent = "";

  } else {

    status.textContent =
      "Discord connected. Account record is not available yet.";
  }
}

// ========================================
// SIGN IN
// ========================================

signin.onclick = async () => {

  status.textContent = "";

  const { error } = await client.auth.signInWithOAuth({
    provider: "discord",
    options: {
      redirectTo:
        window.location.origin +
        window.location.pathname,
      scopes: "identify"
    }
  });

  if (error) {
    status.textContent = error.message;
  }
};

// ========================================
// SIGN OUT
// ========================================

signout.onclick = async () => {

  const { error } = await client.auth.signOut();

  if (error) {
    status.textContent = error.message;
    return;
  }

  showSignedOut();
};

// ========================================
// SESSION UPDATES
// ========================================

client.auth.onAuthStateChange((event, session) => {

  if (event === "SIGNED_OUT") {
    showSignedOut();
  }

  if (event === "SIGNED_IN" && session?.user) {
    setTimeout(loadAccount, 0);
  }
});

loadAccount();

</script>

</body>
</html>
