
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticker Mania | Account</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #090515;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 20px;
  background: #180c2b;
  border-bottom: 2px solid #a635f2;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

button, .button {
  background: #d837f2;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 12px 20px;
  cursor: pointer;
  font-weight: bold;
  text-decoration: none;
}

button:hover, .button:hover {
  background: #b82bd4;
}

main {
  width: min(900px, 94%);
  margin: 40px auto;
}

.account-panel {
  background: #211035;
  border: 2px solid #bd3aff;
  border-radius: 18px;
  padding: 25px;
  margin-bottom: 25px;
}

.account-panel h2 {
  margin-top: 0;
}

.profile {
  display: flex;
  align-items: center;
  gap: 20px;
}

.avatar {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  object-fit: cover;
  background: #432060;
}

.username {
  font-size: 22px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.account-id {
  font-size: 12px;
  color: #bba9ce;
  overflow-wrap: anywhere;
  margin-top: 6px;
}

.collection {
  min-height: 180px;
  border: 2px dashed #683c87;
  border-radius: 12px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  align-content: start;
  gap: 12px;
  color: #bba9ce;
  padding: 20px;
}

.collection-empty {
  grid-column: 1 / -1;
  text-align: center;
  align-self: center;
}

.sticker-item {
  padding: 14px;
  border: 1px solid #843bac;
  border-radius: 10px;
  background: #170a29;
  color: #fff;
  text-align: center;
  overflow-wrap: anywhere;
}

.sticker-item strong {
  display: block;
  margin: 9px 0;
  font-size: 15px;
}

.sticker-type {
  font-size: 11px;
  color: #64ffcb;
  font-weight: bold;
}

.sticker-date {
  margin-top: 9px;
  font-size: 11px;
  color: #bba9ce;
}

.sticker-item img {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  object-fit: contain;
  border-radius: 6px;
}

.status {
  color: #ff9cdd;
  margin-top: 15px;
}

.actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<header>
  <h1>STICKER MANIA</h1>
  <a class="button" href="index.html">BACK TO MACHINE</a>
</header>

<main>

  <!-- ACCOUNT -->
  <section class="account-panel">

    <h2>MY ACCOUNT</h2>

    <div id="loading">
      Checking Discord session...
    </div>

    <div id="profile" class="profile hidden">

      <img
        id="avatar"
        class="avatar"
        alt="Discord Avatar"
      >

      <div>
        <div id="username" class="username"></div>
        <div id="account-id" class="account-id"></div>
      </div>

    </div>

    <p id="status" class="status"></p>

    <div class="actions">
      <button id="signin" class="hidden">
        SIGN IN WITH DISCORD
      </button>

      <button id="signout" class="hidden">
        SIGN OUT
      </button>
    </div>

  </section>

  <!-- COLLECTION -->
  <section class="account-panel">

    <h2>MY COLLECTION</h2>

    <div class="collection" id="collection">
      Your collected items will appear here.
    </div>

  </section>

</main>

<script>

// ========================================
// SUPABASE
// ========================================

const SUPABASE_URL =
  "https://jqvnrdjrkdjgjbmqmbbl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_jmEahTk4OssD_IrOZq_6iQ_P6QFFJr6";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

// ========================================
// ELEMENTS
// ========================================

const loading = document.getElementById("loading");
const profile = document.getElementById("profile");
const avatar = document.getElementById("avatar");
const username = document.getElementById("username");
const accountId = document.getElementById("account-id");
const status = document.getElementById("status");
const signin = document.getElementById("signin");
const signout = document.getElementById("signout");
const collection = document.getElementById("collection");
let activeCollectionUser = null;

function collectionMessage(message) {
  collection.replaceChildren();
  const note = document.createElement("div");
  note.className = "collection-empty";
  note.textContent = message;
  collection.append(note);
}

function makeStickerCard(purchase, capsule) {
  const card = document.createElement("article");
  card.className = "sticker-item";
  const info = capsule?.reward_data || {};
  const artwork = info.image_url || info.image || info.art_url;
  if (typeof artwork === "string" && /^https:\/\//i.test(artwork)) {
    const img = document.createElement("img");
    img.src = artwork;
    img.alt = capsule.reward_name || "Sticker";
    img.loading = "lazy";
    card.append(img);
  }

  const label = document.createElement("div");
  label.className = "sticker-type";
  label.textContent = (purchase.tier || "Sticker").toUpperCase();

  const name = document.createElement("strong");
  name.textContent = capsule?.reward_name || "Collected sticker";

  const date = document.createElement("div");
  date.className = "sticker-date";
  date.textContent = purchase.paid_at
    ? "Collected " + new Date(purchase.paid_at).toLocaleDateString()
    : "Collected";

  card.append(label, name, date);
  return card;
}

// Capsule purchases are the ownership ledger: one paid purchase = one item.
async function loadCollection(user) {
  const id = user.id;
  activeCollectionUser = id;
  collectionMessage("Loading your stickers...");

  try {
    const { data: session } = await client.auth.getSession();
    const token = session?.session?.access_token;
    if (!token) throw new Error("No Discord session");

    // Read only this user's successful purchases. The table's RLS also
    // enforces ownership; pending/expired attempts never enter collections.
    const purchases = [];
    for (let from = 0; ; from += 100) {
      const { data, error } = await client
        .from("capsule_purchases")
        .select("id, tier, paid_at")
        .eq("player_id", id)
        .in("status", ["paid", "fulfilled"])
        .order("paid_at", { ascending: false })
        .range(from, from + 99);
      if (error) throw error;
      purchases.push(...(data || []));
      if (!data || data.length < 100) break;
    }

    if (activeCollectionUser !== id) return;
    if (!purchases.length) {
      collectionMessage("No stickers collected yet.");
      return;
    }

    collection.replaceChildren();
    for (const purchase of purchases) {
      // Reuse the authenticated verifier's existing completed-purchase
      // lookup, avoiding new tables, public capsule reads or extra functions.
      try {
        const { data, error } = await client.functions.invoke("verify-capsule", {
          method: "POST",
          body: { purchaseId: purchase.id },
          headers: { Authorization: "Bearer " + token }
        });
        if (error || !data || data.error || !data.capsule) {
          console.error("[COLLECTION] Sticker lookup failed", purchase.id, error || data?.error);
          continue;
        }
        if (activeCollectionUser !== id) return;
        collection.append(makeStickerCard(purchase, data.capsule));
      } catch (error) {
        console.error("[COLLECTION] Sticker lookup failed", error);
      }
    }

    if (activeCollectionUser === id && !collection.childElementCount) {
      collectionMessage("Your collection could not be loaded. Please try again.");
    }
  } catch (error) {
    console.error("[COLLECTION]", error);
    if (activeCollectionUser === id) {
      collectionMessage("Your collection could not be loaded. Please try again.");
    }
  }
}

// ========================================
// DISPLAY ACCOUNT
// ========================================

function showAccount(user) {

  loading.classList.add("hidden");
  profile.classList.remove("hidden");

  signin.classList.add("hidden");
  signout.classList.remove("hidden");

  const metadata = user.user_metadata || {};

  username.textContent =
    metadata.global_name ||
    metadata.preferred_username ||
    metadata.user_name ||
    metadata.full_name ||
    metadata.name ||
    "Discord User";

  accountId.textContent = "Account: " + user.id;

  const avatarUrl = metadata.avatar_url;

  if (avatarUrl) {
    avatar.src = avatarUrl;
    avatar.classList.remove("hidden");
  } else {
    avatar.removeAttribute("src");
    avatar.classList.add("hidden");
  }

  collectionMessage("Loading your stickers...");
}

// ========================================
// NO SESSION
// ========================================

function showSignedOut() {

  loading.classList.add("hidden");
  profile.classList.add("hidden");

  signin.classList.remove("hidden");
  signout.classList.add("hidden");

  status.textContent =
    "Sign in with Discord to access your account.";

  activeCollectionUser = null;
  collectionMessage("Sign in to view your collection.");
}

// ========================================
// CHECK SESSION
// ========================================

async function loadAccount() {

  const { data, error } = await client.auth.getUser();

  if (error || !data.user) {
    showSignedOut();
    return;
  }

  const user = data.user;

  showAccount(user);
  void loadCollection(user);

  // Read the account created by index.html.
  const { data: account, error: accountError } =
    await client
      .from("sticker_accounts")
      .select("id, discord_id, username")
      .eq("id", user.id)
      .maybeSingle();

  if (accountError) {

    status.textContent =
      "Account lookup failed: " + accountError.message;

    return;
  }

  if (account) {

    username.textContent =
      account.username || username.textContent;

    status.textContent = "";

  } else {

    status.textContent =
      "Discord connected. Account record is not available yet.";
  }
}

// ========================================
// SIGN IN
// ========================================

signin.onclick = async () => {

  status.textContent = "";

  const { error } = await client.auth.signInWithOAuth({
    provider: "discord",
    options: {
      redirectTo:
        window.location.origin +
        window.location.pathname,
      scopes: "identify"
    }
  });

  if (error) {
    status.textContent = error.message;
  }
};

// ========================================
// SIGN OUT
// ========================================

signout.onclick = async () => {

  const { error } = await client.auth.signOut();

  if (error) {
    status.textContent = error.message;
    return;
  }

  showSignedOut();
};

// ========================================
// SESSION UPDATES
// ========================================

client.auth.onAuthStateChange((event, session) => {

  if (event === "SIGNED_OUT") {
    showSignedOut();
  }

  if (event === "SIGNED_IN" && session?.user) {
    setTimeout(loadAccount, 0);
  }
});

loadAccount();

</script>

</body>
</html>
