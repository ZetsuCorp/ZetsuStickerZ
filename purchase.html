
<div
  class="purchase-overlay"
  id="purchase-overlay"
  role="presentation"
>
  <div
    class="purchase-modal"
    role="dialog"
    aria-modal="true"
    aria-label="Sticker Mania Purchase"
  >
    <img
      class="purchase-art"
      src="assets/zcety.png"
      alt="Sticker Mania Common, Rare and Legendary purchase options"
    >

    <button
      class="purchase-hotspot purchase-common"
      data-tier="common"
      aria-label="Purchase Common for $1.00">
    </button>

    <button
      class="purchase-hotspot purchase-rare"
      data-tier="rare"
      aria-label="Purchase Rare for $3.00">
    </button>

    <button
      class="purchase-hotspot purchase-legendary"
      data-tier="legendary"
      aria-label="Purchase Legendary for $5.00">
    </button>

    <button
      class="purchase-hotspot purchase-close"
      id="purchase-close"
      aria-label="Close purchase modal">
    </button>

    <p
      class="purchase-status"
      id="purchase-status"
      role="status">
    </p>
  </div>
</div>
