
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticker Mania</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #090515;
  color: white;
  font-family: Arial, sans-serif;
}

.game-container {
  position: relative;
  width: min(100vw, 700px);
  margin: auto;
}

.machine {
  width: 100%;
  display: block;
}

.dispenser-container {
  position: absolute;
  left: 30.5%;
  top: 83.5%;
  width: 34%;
  height: 10.5%;
  pointer-events: none;
}

.hotspot {
  position: absolute;
  border: 0;
  background: transparent;
  cursor: pointer;
  color: transparent;
  font-size: 0;
  z-index: 2;
}

.hotspot:focus-visible {
  outline: 3px solid white;
}

.pay-button {
  left: 77.5%;
  top: 27.5%;
  width: 14.3%;
  height: 23.4%;
}

.signin-button {
  left: 78.4%;
  top: 50.4%;
  width: 13%;
  height: 13.4%;
}

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: #05020be0;
  align-items: center;
  justify-content: center;
  z-index: 10;
  padding: 20px;
}

.overlay.open {
  display: flex;
}

.panel {
  position: relative;
  background: #211035;
  border: 2px solid #bd3aff;
  border-radius: 18px;
  padding: 32px;
  width: min(420px, 95vw);
  text-align: center;
}

.close {
  position: absolute;
  top: 10px;
  right: 15px;
  background: none;
  border: none;
  color: white;
  font-size: 28px;
  cursor: pointer;
}

.action {
  background: #d837f2;
  border: none;
  color: white;
  padding: 12px 22px;
  border-radius: 10px;
  cursor: pointer;
}

.action:disabled {
  opacity: 0.6;
  cursor: wait;
}

#auth-status {
  font-size: 13px;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<!-- GAME CONTAINER -->
<div class="game-container" id="game-container">

  <!-- MACHINE IMAGE -->
  <img
    class="machine"
    src="assets/ZetsuStickerZ.png"
    alt="Sticker Mania Machine"
  >

  <!-- DISPENSER CONTAINER -->
  <div
    class="dispenser-container"
    id="dispenser-container">
  </div>

  <!-- BUTTON 1: PAY -->
  <button
    class="hotspot pay-button"
    id="pay-button"
    aria-label="Pay with AWT">
  </button>

  <!-- BUTTON 2: SIGN IN -->
  <button
    class="hotspot signin-button"
    id="signin-button"
    aria-label="Sign in">
  </button>

</div>

<!-- SIGN IN OVERLAY -->
<div class="overlay" id="overlay">
  <div class="panel">

    <button class="close" id="close">×</button>

    <h2>SIGN IN</h2>

    <p>
      Sign in with Discord to access your
      Sticker Mania account.
    </p>

    <button class="action" id="discord-auth">
      Continue with Discord
    </button>

    <p id="auth-status" role="status"></p>

  </div>
</div>

<script>

// ========================================
// SUPABASE CONFIGURATION
// ========================================

const SUPABASE_URL =
  "https://jqvnrdjrkdjgjbmqmbbl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_jmEahTk4OssD_IrOZq_6iQ_P6QFFJr6";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const ACCOUNT_URL = new URL(
  "account.html",
  window.location.href
).href;

let currentUser = null;

// ========================================
// ELEMENTS
// ========================================

const overlay = document.getElementById("overlay");
const authButton = document.getElementById("discord-auth");
const authStatus = document.getElementById("auth-status");

// ========================================
// DISCORD ACCOUNT INFORMATION
// ========================================

function getDiscordUsername(user) {
  if (!user) return "Discord user";

  return (
    user.user_metadata?.custom_claims?.global_name ||
    user.user_metadata?.global_name ||
    user.user_metadata?.preferred_username ||
    user.user_metadata?.user_name ||
    user.user_metadata?.full_name ||
    user.user_metadata?.name ||
    user.email ||
    "Discord user"
  );
}

function getDiscordId(user) {
  if (!user) return null;

  const discordIdentity = user.identities?.find(
    identity => identity.provider === "discord"
  );

  return (
    discordIdentity?.id ||
    discordIdentity?.identity_data?.provider_id ||
    user.user_metadata?.provider_id ||
    user.user_metadata?.sub ||
    null
  );
}

// ========================================
// CREATE OR UPDATE STICKER ACCOUNT
// ========================================

async function syncStickerAccount(user) {

  if (!user) return;

  const account = {
    id: user.id,
    discord_id: getDiscordId(user),
    username: getDiscordUsername(user),
    updated_at: new Date().toISOString()
  };

  const { error } = await client
    .from("sticker_accounts")
    .upsert(account, {
      onConflict: "id"
    });

  if (error) throw error;
}

// ========================================
// SIGN IN OVERLAY
// ========================================

function openSignIn() {
  authStatus.textContent = "";
  overlay.classList.add("open");
}

function closeSignIn() {
  overlay.classList.remove("open");
}

// ========================================
// GO TO ACCOUNT
// ========================================

async function goToAccount() {

  if (!currentUser) {
    openSignIn();
    return;
  }

  try {
    await syncStickerAccount(currentUser);
  } catch (error) {
    console.error("Account sync error:", error);
    authStatus.textContent =
      "Account sync failed: " + error.message;
    openSignIn();
    return;
  }

  window.location.href = ACCOUNT_URL;
}

// ========================================
// DISCORD AUTHENTICATION
// ========================================

authButton.onclick = async () => {

  authButton.disabled = true;
  authStatus.textContent = "";

  try {

    const { error } =
      await client.auth.signInWithOAuth({
        provider: "discord",
        options: {
          redirectTo: ACCOUNT_URL,
          scopes: "identify"
        }
      });

    if (error) throw error;

  } catch (error) {

    authStatus.textContent = error.message;
    console.error("Discord auth error:", error);

  } finally {

    authButton.disabled = false;

  }
};

// ========================================
// BUTTON ACTIONS
// ========================================

document.getElementById("signin-button").onclick =
  goToAccount;

document.getElementById("pay-button").onclick =
  goToAccount;

// ========================================
// SESSION RESTORATION
// ========================================

async function restoreSession() {

  const { data, error } = await client.auth.getUser();

  if (error) {
    console.error("Session error:", error);
    return;
  }

  currentUser = data.user || null;
}

client.auth.onAuthStateChange((event, session) => {

  currentUser = session?.user || null;

  if (event === "SIGNED_IN" && currentUser) {
    setTimeout(async () => {
      try {
        await syncStickerAccount(currentUser);
      } catch (error) {
        console.error("Account sync error:", error);
      }
    }, 0);
  }
});

restoreSession();

// ========================================
// CLOSE OVERLAY
// ========================================

document.getElementById("close").onclick =
  closeSignIn;

overlay.onclick = (event) => {
  if (event.target === overlay) {
    closeSignIn();
  }
};

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    closeSignIn();
  }
});

</script>

</body>
</html>
