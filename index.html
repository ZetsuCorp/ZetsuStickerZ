<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticker Mania</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@solana/web3.js@1.98.4/lib/index.iife.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100dvh;
  font-family: Arial, sans-serif;
  background: #090515;
  color: white;
}

/* VENDING MACHINE */

.arcade-viewport {
  min-height: 100svh;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 12px;
  background: radial-gradient(
    ellipse at center,
    #24113f,
    #10071f 55%,
    #05030c
  );
}

.arcade-container {
  position: relative;
  width: min(100%, 900px, calc(100svh - 24px));
  aspect-ratio: 1 / 1;
  flex: 0 0 auto;
  border: 2px solid #543184;
  border-radius: 18px;
  overflow: hidden;
  background: #080412;
}

.game-container {
  position: relative;
  width: 100%;
  height: 100%;
}

.machine {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.dispenser-container {
  position: absolute;
  left: 30.5%;
  top: 83.5%;
  width: 34%;
  height: 10.5%;
  pointer-events: none;
}

.buy-log {
  position: absolute; z-index: 4; left: 2%; bottom: 2%; width: 72%;
  height: 13%; overflow-y: auto; padding: 4px;
  border: 1px solid rgba(148,59,206,.45); border-radius: 6px;
  background: rgba(9,5,26,.45); color: #f4d5ff;
  font-size: clamp(6px, .72vw, 9px); line-height: 1.15;
  scrollbar-width: thin;
}
.buy-log-title { color: #64ffcb; font-size: inherit; font-weight: bold; margin-bottom: 2px; }
.buy-log-entry {
  padding: 2px 0; border-top: 1px solid rgba(81,52,107,.4);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* GLOBAL VOLUME CONTROL — available during capsule videos */
.app-volume {
  position: absolute;
  top: 36px;
  right: 8px;
  z-index: 60;
  display: flex;
  align-items: center;
  gap: 5px;
  width: min(152px, 40%);
  padding: 3px 6px;
  border: 1px solid rgba(148,59,206,.65);
  border-radius: 9px;
  background: rgba(9,5,26,.78);
}
.app-volume button {
  border: 0;
  background: none;
  color: white;
  font-size: clamp(14px, 2vmin, 20px);
  line-height: 1;
  cursor: pointer;
  padding: 2px;
  flex: 0 0 auto;
}
.app-volume input {
  flex: 1 1 auto;
  width: 0;
  min-width: 0;
  accent-color: #64ffcb;
  cursor: pointer;
}

/* CAPSULE OPENING VIDEO */
.sticker-video-overlay {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  background: rgba(5, 2, 11, 0.94);
}
.sticker-video-overlay[hidden] { display: none; }
.sticker-video-overlay video {
  display: block;
  max-width: 100%;
  max-height: 92dvh;
  width: auto;
  height: auto;
  border-radius: 12px;
  object-fit: contain;
}

/* SOL PRICE LABELS */

.sol-price-tag,
.purchase-price-tag {
  position: absolute;
  z-index: 3;
  padding: 3px 6px;
  border: 1px solid #943bce;
  border-radius: 4px;
  background: rgba(9, 5, 26, 0.87);
  color: #64ffcb;
  font-size: 11px;
  font-weight: bold;
  line-height: 1.2;
  white-space: nowrap;
  pointer-events: none;
}

.sol-price-tag {
  top: 8px;
  right: 8px;
}

.purchase-price-tag {
  top: 8px;
  left: 8px;
}

/* CLICKABLE AREAS */

.hotspot {
  position: absolute;
  z-index: 2;
  border: none;
  padding: 0;
  background: transparent;
  cursor: pointer;
}

.hotspot:focus-visible,
.purchase-hotspot:focus-visible {
  outline: 2px solid white;
}

.pay-button {
  left: 77.5%;
  top: 27.5%;
  width: 14.3%;
  height: 23.4%;
}

.signin-button {
  left: 78.4%;
  top: 50.4%;
  width: 13%;
  height: 13.4%;
  overflow: hidden;
}

/* COLLECTION */

.collection-button {
  display: none;
  width: 100%;
  height: 100%;
  background: #090c32;
  border: 2px solid #527cff;
  border-radius: 10px;
  box-shadow: 0 0 10px #315dff;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 5px;
}

.signin-button.signed-in .collection-button {
  display: flex;
}

.collection-avatar {
  width: 48%;
  aspect-ratio: 1;
  border-radius: 50%;
  object-fit: cover;
  background: #29235d;
}

.collection-label {
  color: white;
  font-weight: bold;
  font-size: clamp(6px, 1.3vw, 10px);
  text-shadow: 0 0 5px #527cff;
}

/* OVERLAYS */

.auth-overlay,
.purchase-overlay {
  position: fixed;
  inset: 0;
  align-items: center;
  justify-content: center;
  padding: 12px;
}

.auth-overlay {
  display: none;
  z-index: 20;
  background: rgba(5, 2, 11, 0.92);
}

.auth-overlay.open {
  display: flex;
}

.auth-panel {
  position: relative;
  width: min(420px, 95vw);
  padding: 30px;
  border: 2px solid #bd3aff;
  border-radius: 18px;
  background: #211035;
  text-align: center;
}

.auth-close {
  position: absolute;
  top: 8px;
  right: 14px;
  background: none;
  border: 0;
  color: white;
  font-size: 28px;
  cursor: pointer;
}

.auth-action {
  border: 0;
  border-radius: 10px;
  background: #d837f2;
  padding: 12px 22px;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.auth-action:disabled {
  opacity: 0.5;
}

#auth-status {
  font-size: 13px;
  overflow-wrap: anywhere;
}

/* CAPSULE MENU */

.purchase-overlay {
  display: flex;
  z-index: 15;
  background: rgba(5, 2, 11, 0.86);
}

.purchase-overlay[hidden],
.payment-panel[hidden] {
  display: none;
}

.purchase-modal {
  position: relative;
  width: min(94vw, 760px, 88svh);
  max-height: 88svh;
  border: 2px solid #bd3aff;
  border-radius: 14px;
  background: #080412;
  overflow: hidden;
  box-shadow: 0 0 35px #9b28e888;
}

.purchase-art {
  display: block;
  width: 100%;
  height: auto;
}

.purchase-hotspot {
  position: absolute;
  z-index: 2;
  border: 0;
  background: transparent;
  cursor: pointer;
}

.purchase-hotspot:disabled {
  cursor: wait;
}

.purchase-common {
  left: 13%;
  top: 65%;
  width: 21%;
  height: 11%;
}

.purchase-rare {
  left: 40%;
  top: 65%;
  width: 20%;
  height: 11%;
}

.purchase-legendary {
  left: 67%;
  top: 65%;
  width: 20%;
  height: 11%;
}

.purchase-close {
  right: 8.3%;
  top: 8.5%;
  width: 5%;
  height: 7%;
}

.purchase-status {
  position: absolute;
  left: 10%;
  bottom: 2%;
  width: 80%;
  margin: 0;
  color: white;
  font-size: clamp(9px, 1.4vw, 13px);
  text-align: center;
  text-shadow: 0 0 7px #bd3aff;
  overflow-wrap: anywhere;
  pointer-events: none;
}

/* SOLANA PAY PANEL */

.payment-panel {
  position: absolute;
  z-index: 5;
  inset: 4%;
  border: 2px solid #bd3aff;
  border-radius: 12px;
  padding: 12px;
  overflow-y: auto;
  background: rgba(9, 5, 22, 0.98);
  box-shadow: 0 0 25px #bd3aff77;
  text-align: center;
}

.payment-panel h2 {
  font-size: clamp(16px, 2.4vw, 23px);
  margin: 6px 0;
}

.payment-panel p {
  font-size: clamp(11px, 1.6vw, 14px);
  overflow-wrap: anywhere;
}

.payment-amount {
  font-size: clamp(16px, 3vw, 24px);
  font-weight: bold;
  color: #f6d2ff;
  overflow-wrap: anywhere;
}

#payment-qr {
  display: block;
  width: min(42%, 180px);
  height: auto;
  margin: 10px auto;
  padding: 7px;
  background: white;
  border-radius: 8px;
}

.payment-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
}

.payment-actions button,
.payment-actions a {
  display: inline-block;
  padding: 9px 12px;
  border: 0;
  border-radius: 7px;
  background: #ae2bdd;
  color: white;
  font-size: 12px;
  font-weight: bold;
  text-decoration: none;
  cursor: pointer;
}

.payment-actions .secondary {
  background: #383050;
}

#payment-message {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.payment-error {
  color: #ff9f9f;
}

/* MOBILE */

@media (max-width: 600px) {
  .arcade-viewport {
    padding: 4px;
  }

  .arcade-container {
    width: min(100%, calc(100svh - 8px));
    border-width: 1px;
    border-radius: 8px;
  }

  .app-volume {
    top: 25px;
    right: 4px;
    width: min(120px, 39%);
    padding: 2px 4px;
    gap: 3px;
    border-radius: 6px;
  }

  .app-volume button {
    font-size: 15px;
    padding: 1px;
  }

  .buy-log {
    font-size: clamp(7px, 1.25vw, 9px);
  }

  .sol-price-tag,
  .purchase-price-tag {
    top: 4px;
    padding: 2px 4px;
    font-size: 8px;
  }

  .sol-price-tag {
    right: 4px;
  }

  .purchase-price-tag {
    left: 4px;
  }

  .collection-button {
    gap: 2px;
    padding: 2px;
    border-radius: 5px;
  }

  .collection-label {
    font-size: 6px;
  }

  .purchase-overlay {
    padding: 5px;
  }

  .purchase-modal {
    width: min(98vw, 88svh);
    border-radius: 7px;
    border-width: 1px;
  }

  .purchase-status {
    font-size: 8px;
  }

  .payment-panel {
    padding: 7px;
  }

  #payment-qr {
    width: min(35%, 130px);
    margin: 5px auto;
  }

  .payment-actions button,
  .payment-actions a {
    font-size: 10px;
    padding: 6px;
  }
}
</style>
</head>

<body>

<!-- VENDING MACHINE -->

<main class="arcade-viewport">
  <div class="arcade-container">
    <div class="game-container" id="game-container">

      <img
        class="machine"
        src="assets/ZetsuStickerZ.png"
        alt="Sticker Mania Vending Machine"
      >

      <span
        class="sol-price-tag"
        id="sol-price-main"
        title="Current SOL price in USD">SOL LOADING...</span>

      <div class="app-volume" aria-label="App sound">
        <button type="button" id="app-volume-toggle" aria-label="Mute sound" title="Mute sound">🔊</button>
        <input id="app-volume-level" type="range" min="0" max="100" value="80" aria-label="Volume">
      </div>

      <div
        class="dispenser-container"
        id="dispenser-container">
      </div>

      <section class="buy-log" aria-label="Recent sticker purchases">
        <div class="buy-log-title">RECENT BUYS</div>
        <div id="buy-log-items">No purchases yet</div>
      </section>

      <button
        class="hotspot pay-button"
        id="pay-button"
        aria-label="Buy capsules">
      </button>

      <button
        class="hotspot signin-button"
        id="signin-button"
        aria-label="Discord login or collection">

        <span class="collection-button">
          <img
            class="collection-avatar"
            id="collection-avatar"
            alt="Profile"
          >

          <span class="collection-label">
            MY COLLECTION
          </span>
        </span>

      </button>

    </div>
  </div>
</main>

<!-- CAPSULE OPENING ANIMATION -->
<div class="sticker-video-overlay" id="sticker-video-overlay" hidden>
  <video id="sticker-video"
    src="assets/Machines_sifting_as_lights_dance_20261011202211.mp4"
    playsinline preload="auto"></video>
</div>

<!-- CAPSULE PURCHASE MENU -->

<div
  class="purchase-overlay"
  id="purchase-overlay"
  hidden>

  <div
    class="purchase-modal"
    role="dialog"
    aria-modal="true"
    aria-label="Capsule purchase">

    <img
      class="purchase-art"
      src="assets/zcety.png"
      alt="Select your capsule"
    >

    <span
      class="purchase-price-tag"
      id="sol-price-purchase"
      title="Current SOL price in USD">SOL LOADING...</span>

    <button
      class="purchase-hotspot purchase-common"
      data-tier="common"
      aria-label="Common Capsule $0.05">
    </button>

    <button
      class="purchase-hotspot purchase-rare"
      data-tier="rare"
      aria-label="Rare Capsule $1">
    </button>

    <button
      class="purchase-hotspot purchase-legendary"
      data-tier="legendary"
      aria-label="Legendary Capsule $3">
    </button>

    <button
      class="purchase-hotspot purchase-close"
      id="purchase-close"
      aria-label="Close">
    </button>

    <p
      class="purchase-status"
      id="purchase-status"
      role="status">
    </p>



  </div>
</div>

<!-- DISCORD SIGN IN -->

<div class="auth-overlay" id="auth-overlay">
  <div class="auth-panel">

    <button
      class="auth-close"
      id="auth-close"
      aria-label="Close">
      ×
    </button>

    <h2>SIGN IN</h2>

    <p>
      Sign in with Discord to access
      your Sticker Mania account.
    </p>

    <button
      class="auth-action"
      id="discord-auth">
      Continue with Discord
    </button>

    <p id="auth-status" role="status"></p>

  </div>
</div>

<script>

/* CONFIGURATION */

const SUPABASE_URL =
  "https://jqvnrdjrkdjgjbmqmbbl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_jmEahTk4OssD_IrOZq_6iQ_P6QFFJr6";

const RECEIVER =
  "CT1fjjJMaNb2jgwH7rnuyiLcASmtmdRzSw7tQv8VXaRK";

const CAPSULE_PRICES = {
  common: 0.05,
  rare: 1.00,
  legendary: 3.00
};

const ACCOUNT_URL =
  new URL("account.html", window.location.href).href;

const PRICE_REFRESH_MS = 60000;
const PAYMENT_CHECK_MS = 2000;

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);

/* STATE */

let currentUser = null;
let activePurchase = null;

let paymentTimer = null;
let purchasing = false;
let checkingPayment = false;

/* ELEMENTS */

const priceMain = $("sol-price-main");
const pricePurchase = $("sol-price-purchase");

const payButton = $("pay-button");
const signinButton = $("signin-button");

const collectionAvatar = $("collection-avatar");

const purchaseOverlay = $("purchase-overlay");
const purchaseClose = $("purchase-close");
const purchaseStatus = $("purchase-status");

const dispenser = $("dispenser-container");

/* Shared app audio preference; all app sounds can use this setting. */
const volumeToggle = $("app-volume-toggle");
const volumeLevel = $("app-volume-level");
const volumeVideo = $("sticker-video");
const SOUND_PREF = "sticker_mania_volume";

let appVolume = 0.8;
let appMuted = false;
try {
  const saved = JSON.parse(localStorage.getItem(SOUND_PREF) || "null");
  if (saved && Number.isFinite(saved.volume)) {
    appVolume = Math.max(0, Math.min(1, saved.volume));
    appMuted = !!saved.muted;
  }
} catch (error) {
  console.warn("[AUDIO PREFERENCE]", error);
}
function applyAppVolume() {
  volumeVideo.volume = appVolume;
  volumeVideo.muted = appMuted || appVolume === 0;
  volumeLevel.value = String(Math.round(appVolume * 100));
  const muted = volumeVideo.muted;
  volumeToggle.textContent = muted ? "🔇" : "🔊";
  volumeToggle.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound");
  volumeToggle.title = muted ? "Unmute sound" : "Mute sound";
  volumeToggle.setAttribute("aria-pressed", String(muted));
  try {
    localStorage.setItem(SOUND_PREF, JSON.stringify({
      volume: appVolume, muted: appMuted
    }));
  } catch (error) {
    console.warn("[AUDIO PREFERENCE]", error);
  }
}
volumeToggle.onclick = () => {
  if (appMuted || appVolume === 0) {
    if (appVolume === 0) appVolume = 0.8;
    appMuted = false;
  } else {
    appMuted = true;
  }
  applyAppVolume();
};
volumeLevel.oninput = () => {
  appVolume = Number(volumeLevel.value) / 100;
  appMuted = appVolume === 0;
  applyAppVolume();
};
applyAppVolume();

const authOverlay = $("auth-overlay");
const authButton = $("discord-auth");
const authStatus = $("auth-status");

const tierButtons = [
  ...document.querySelectorAll("[data-tier]")
];

/* FUNCTION ERROR DETAILS */

async function functionError(error) {
  let message = error?.message || "Unknown error";

  if (error?.context instanceof Response) {
    const response = error.context;

    try {
      const text = await response.clone().text();

      try {
        const json = JSON.parse(text);

        message =
          json.error ||
          json.message ||
          JSON.stringify(json);

      } catch {
        message = text || message;
      }

    } catch {}

    return `HTTP ${response.status}: ${message}`;
  }

  return message;
}

/* LIVE SOL/USD PRICE: PUBLIC MARKET DATA, NO SUPABASE FUNCTION */

let lastSOLPrice = null;

function formatPrice(price) {
  return "$" + Number(price).toFixed(2);
}

async function refreshSOLPrice() {
  const feeds = [
    {
      url: "https://api.coinbase.com/v2/prices/SOL-USD/spot",
      get: json => json?.data?.amount
    },
    {
      url: "https://api.kraken.com/0/public/Ticker?pair=SOLUSD",
      get: json => Object.values(json?.result || {})[0]?.c?.[0]
    },
    {
      url: "https://api.coingecko.com/api/v3/simple/price?ids=solana&vs_currencies=usd",
      get: json => json?.solana?.usd
    }
  ];

  for (const feed of feeds) {
    try {
      const response = await fetch(feed.url, {
        method: "GET",
        cache: "no-store",
        credentials: "omit",
        signal: AbortSignal.timeout(6000)
      });
      if (!response.ok) continue;

      const price = Number(feed.get(await response.json()));
      if (!Number.isFinite(price) || price <= 0) continue;

      lastSOLPrice = price;
      const label = "SOL " + formatPrice(price);
      priceMain.textContent = label;
      pricePurchase.textContent = label;
      return;
    } catch (error) {
      console.warn("[SOL PRICE] Market feed unavailable:", feed.url, error);
    }
  }

  // Preserve the last valid quote if all price feeds temporarily fail.
  const label = lastSOLPrice === null
    ? "SOL PRICE UNAVAILABLE"
    : "SOL " + formatPrice(lastSOLPrice) + " (LAST)";
  priceMain.textContent = label;
  pricePurchase.textContent = label;
}

function updateSOLPrice() {
  void refreshSOLPrice();
}

/* DISCORD USER INFORMATION */

function discordName(user) {
  return (
    user?.user_metadata?.global_name ||
    user?.user_metadata?.preferred_username ||
    user?.user_metadata?.user_name ||
    user?.user_metadata?.full_name ||
    user?.user_metadata?.name ||
    "Discord User"
  );
}

function discordId(user) {
  const identity = user?.identities?.find(
    identity => identity.provider === "discord"
  );

  return (
    identity?.id ||
    identity?.identity_data?.provider_id ||
    user?.user_metadata?.provider_id ||
    null
  );
}

/* LOGIN DISPLAY */

function updateLoginDisplay() {
  const signedIn = !!currentUser;

  signinButton.classList.toggle(
    "signed-in",
    signedIn
  );

  const avatar =
    currentUser?.user_metadata?.avatar_url;

  if (signedIn && avatar) {
    collectionAvatar.src = avatar;
    collectionAvatar.style.display = "block";
  } else {
    collectionAvatar.removeAttribute("src");
    collectionAvatar.style.display = "none";
  }
}

/* ACCOUNT SYNC */

async function syncAccount(user) {
  if (!user) return;

  const { error } = await client
    .from("sticker_accounts")
    .upsert(
      {
        id: user.id,
        discord_id: discordId(user),
        username: discordName(user),
        updated_at: new Date().toISOString()
      },
      {
        onConflict: "id"
      }
    );

  if (error) {
    console.error("[ACCOUNT SYNC]", error.message);
  }
}

/* DISCORD AUTHENTICATION */

function openAuth() {
  authStatus.textContent = "";
  authOverlay.classList.add("open");
}

function closeAuth() {
  authOverlay.classList.remove("open");
}

authButton.onclick = async () => {
  authButton.disabled = true;
  authStatus.textContent = "";

  try {
    const { error } =
      await client.auth.signInWithOAuth({
        provider: "discord",
        options: {
          redirectTo: ACCOUNT_URL,
          scopes: "identify"
        }
      });

    if (error) {
      throw error;
    }
  } catch (error) {
    authStatus.textContent = error.message;
  } finally {
    authButton.disabled = false;
  }
};

signinButton.onclick = () => {
  if (!currentUser) {
    openAuth();
    return;
  }

  window.location.href = ACCOUNT_URL;
};

$("auth-close").onclick = closeAuth;

authOverlay.onclick = event => {
  if (event.target === authOverlay) {
    closeAuth();
  }
};

client.auth.onAuthStateChange(
  (event, session) => {
    currentUser = session?.user || null;

    updateLoginDisplay();

    if (event === "SIGNED_IN" && currentUser) {
      const user = currentUser;

      setTimeout(() => {
        void syncAccount(user);
        resumePendingPayment();
      }, 0);
    }
  }
);

async function restoreUser() {
  const { data, error } =
    await client.auth.getUser();

  if (error) {
    console.error("[SESSION]", error.message);
  }

  currentUser = data?.user || null;

  updateLoginDisplay();
  resumePendingPayment();
}

void restoreUser();

/* AUTHENTICATED EDGE FUNCTIONS */

async function invoke(name, body) {
  const {
    data: sessionData,
    error: sessionError
  } = await client.auth.getSession();

  if (sessionError) {
    throw sessionError;
  }

  const token = sessionData.session?.access_token;

  if (!token) {
    throw new Error("Sign in with Discord");
  }

  const { data, error } =
    await client.functions.invoke(
      name,
      {
        method: "POST",
        body,
        headers: {
          Authorization: "Bearer " + token
        }
      }
    );

  if (error) {
    const detail = await functionError(error);
    if (error.name === "FunctionsFetchError" ||
        /Failed to send a request to the Edge Function/i.test(detail)) {
      throw new Error(
        "Payment server unavailable (" + name +
        "). Its Supabase Edge Function must be deployed."
      );
    }
    throw new Error(detail);
  }

  if (!data || data.error) {
    throw new Error(
      data?.error || "Invalid function response"
    );
  }

  return data;
}

/* PENDING TRANSACTION */

function pendingKey() {
  return (
    "sticker_mania_pending_" +
    (currentUser?.id || "anonymous")
  );
}

// Each payment keeps its own reference; previous attempts must never block
// a new purchase or get overwritten before their reward is recovered.
function readPending() {
  try {
    const raw = JSON.parse(localStorage.getItem(pendingKey()) || "[]");
    const list = Array.isArray(raw) ? raw : [raw]; // legacy single-payment record
    return list.filter(p => p && typeof p.purchaseId === "string");
  } catch (error) {
    console.error("[PENDING PURCHASE]", error);
    return [];
  }
}

function savePending(purchase) {
  try {
    const list = readPending().filter(p => p.purchaseId !== purchase.purchaseId);
    list.push(purchase);
    localStorage.setItem(pendingKey(), JSON.stringify(list.slice(-20)));
  } catch (error) {
    console.error("[PENDING PURCHASE]", error);
  }
}

function clearPending(purchaseId) {
  try {
    const list = readPending().filter(p => p.purchaseId !== purchaseId);
    if (list.length) localStorage.setItem(pendingKey(), JSON.stringify(list));
    else localStorage.removeItem(pendingKey());
  } catch (error) {
    console.error("[PENDING PURCHASE]", error);
  }
}

/* PURCHASE VALIDATION */

function validatePurchase(data, tier) {
  if (
    !data ||
    !data.purchaseId ||
    !data.reference ||
    !data.paymentUrl ||
    data.receiver !== RECEIVER
  ) {
    throw new Error("Incomplete purchase response");
  }

  if (
    Number(data.priceUsd) !==
    CAPSULE_PRICES[tier]
  ) {
    throw new Error("Incorrect capsule price");
  }

  const amount = Number(data.solAmount);

  if (
    !Number.isFinite(amount) ||
    amount <= 0
  ) {
    throw new Error("Invalid SOL payment amount");
  }

  const url = new URL(data.paymentUrl);

  if (
    url.protocol !== "solana:" ||
    url.pathname !== RECEIVER ||
    url.searchParams.has("spl-token") ||
    url.searchParams.get("reference") !== data.reference ||
    Number(url.searchParams.get("amount")) !== amount
  ) {
    throw new Error("Invalid Solana Pay payment request");
  }
}

/* VERIFIED PUBLIC BUY LOG */
async function refreshBuyLog() {
  try {
    const { data, error } = await client.rpc("recent_sticker_buys", { max_rows: 15 });
    if (error) throw error;
    const list = $("buy-log-items");
    list.replaceChildren();
    if (!data?.length) { list.textContent = "No purchases yet"; return; }
    for (const buy of data) {
      const item = document.createElement("div");
      item.className = "buy-log-entry";
      item.textContent = (buy.buyer || "User") + " got " +
        (buy.sticker || "Sticker") + " (" + (buy.tier || "common") + ")";
      list.append(item);
    }
  } catch (error) { console.error("[BUY LOG]", error); }
}
void refreshBuyLog();
setInterval(refreshBuyLog, 15000);

/* INSTANT CAPSULE CHECKOUT — NO PAYMENT SCREEN */

function purchaseExpired(purchase) {
  return !!purchase?.expiresAt && Date.now() >= Date.parse(purchase.expiresAt);
}

/* Verified purchase: play the machine animation before revealing the sticker.
   Queue clips so simultaneous confirmations never hide each other. */
let stickerRevealQueue = Promise.resolve();

function playStickerOpening() {
  return new Promise(resolve => {
    const overlay = $("sticker-video-overlay");
    const video = $("sticker-video");
    let finished = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      clearTimeout(watchdog);
      video.onended = null;
      video.onerror = null;
      video.pause();
      overlay.hidden = true;
      resolve();
    };
    // Never withhold a purchased sticker due to failed or stalled playback.
    const watchdog = setTimeout(finish, 90000);
    video.onended = finish;
    video.onerror = finish;
    overlay.hidden = false;
    try {
      applyAppVolume();
      video.currentTime = 0;
      const playing = video.play();
      if (playing && typeof playing.catch === "function") playing.catch(finish);
    } catch (error) {
      console.error("[STICKER VIDEO]", error);
      finish();
    }
  });
}

function revealPurchasedSticker(capsule) {
  stickerRevealQueue = stickerRevealQueue.catch(console.error).then(async () => {
    await playStickerOpening();
    dispenseReward(capsule);
  });
}

function dispenseReward(capsule) {
  const reward = document.createElement("div");
  reward.textContent = capsule?.reward_name || "CAPSULE DISPENSED";
  reward.style.cssText =
    "position:absolute;left:0;top:-90%;width:100%;min-height:125%;" +
    "display:grid;place-items:center;padding:5px;border:2px solid #64ffcb;" +
    "border-radius:10px;background:#140829;color:#64ffcb;" +
    "font-weight:bold;font-size:clamp(9px,1.5vw,16px);" +
    "text-align:center;overflow-wrap:anywhere;box-shadow:0 0 22px #8c46ff";
  dispenser.replaceChildren(reward);
  dispenser.setAttribute("aria-live", "polite");
}

function stopPolling() {
  if (paymentTimer !== null) clearInterval(paymentTimer);
  paymentTimer = null;
}

async function checkPayment() {
  if (checkingPayment || !currentUser) return;
  checkingPayment = true;
  try {
    for (const purchase of readPending()) {
      try {
        const result = await invoke("verify-capsule", {
          purchaseId: purchase.purchaseId,
          ...(purchase.signature ? { signature: purchase.signature } : {})
        });
        if (result.status === "paid" || result.status === "fulfilled") {
          clearPending(purchase.purchaseId);
          revealPurchasedSticker(result.capsule);
          void refreshBuyLog();
        } else if (result.status === "expired" || result.status === "cancelled") {
          clearPending(purchase.purchaseId);
        }
      } catch (error) {
        console.error("[CAPSULE VERIFICATION]", error);
        // A deleted or inaccessible purchase is not a customer-facing error.
        // Discard only that stale record so other payments can still resolve.
        if (/HTTP 404: Purchase not found/i.test(String(error?.message || error))) {
          clearPending(purchase.purchaseId);
        }
      }
    }
  } finally {
    checkingPayment = false;
  }
}

function startPolling() {
  if (paymentTimer !== null || !readPending().length) return;
  const began = Date.now();
  void checkPayment();
  paymentTimer = setInterval(() => {
    if (!readPending().length || Date.now() - began > 180000) {
      stopPolling();
      return;
    }
    void checkPayment();
  }, PAYMENT_CHECK_MS);
}

function resumePendingPayment() {
  if (currentUser && readPending().length) startPolling();
}

function closePurchase() {
  purchaseOverlay.hidden = true;
  purchaseStatus.textContent = "";
  payButton.focus();
}

function openPurchase() {
  purchaseOverlay.hidden = false;
  purchaseStatus.textContent = "";
  updateSOLPrice();
}

async function buyCapsule(tier) {
  if (purchasing) return;
  if (!Object.prototype.hasOwnProperty.call(CAPSULE_PRICES, tier)) return;
  if (!currentUser) { closePurchase(); openAuth(); return; }

  purchasing = true;
  tierButtons.forEach(button => { button.disabled = true; });
  purchaseStatus.textContent = "OPENING PHANTOM...";

  let purchase = null;
  try {
    const phantom = window.phantom?.solana ||
      (window.solana?.isPhantom ? window.solana : null);

    // Connect immediately from the capsule click to preserve wallet activation.
    const wallet = phantom ? await phantom.connect() : null;

    const result = await invoke("purchase-capsule", { tier });
    validatePurchase(result, tier);
    purchase = {
      purchaseId: result.purchaseId,
      tier,
      priceUsd: result.priceUsd,
      solAmount: result.solAmount,
      reference: result.reference,
      paymentUrl: result.paymentUrl,
      expiresAt: result.expiresAt
    };
    savePending(purchase);

    if (!phantom) {
      // Solana Pay link is the mobile wallet fallback; no QR or second button.
      closePurchase();
      startPolling();
      window.location.href = purchase.paymentUrl;
      return;
    }

    const web3 = window.solanaWeb3;
    if (!web3) throw new Error("Solana web3.js was not loaded");
    if (purchaseExpired(purchase)) throw new Error("Payment window expired");

    const lamports = Math.round(Number(purchase.solAmount) * 1_000_000_000);
    if (!Number.isSafeInteger(lamports) || lamports <= 0) {
      throw new Error("Invalid SOL amount");
    }

    const transfer = web3.SystemProgram.transfer({
      fromPubkey: wallet.publicKey,
      toPubkey: new web3.PublicKey(RECEIVER),
      lamports
    });
    // Solana Pay's read-only, non-signer reference on the transfer.
    transfer.keys.push({
      pubkey: new web3.PublicKey(purchase.reference),
      isSigner: false,
      isWritable: false
    });
    const tx = new web3.Transaction().add(transfer);
    tx.feePayer = wallet.publicKey;

    const { data: block, error: blockError } = await client.functions.invoke(
      "solana-blockhash", { method: "POST", body: {} }
    );
    if (blockError || !block?.blockhash) {
      throw new Error(blockError ? await functionError(blockError) : "SOL RPC unavailable");
    }
    if (purchaseExpired(purchase)) throw new Error("Payment window expired");
    tx.recentBlockhash = block.blockhash;

    // Phantom handles authorization, signing and broadcasting.
    const sent = await phantom.signAndSendTransaction(tx);
    if (!sent?.signature) throw new Error("Phantom did not return a transaction");
    purchase.signature = sent.signature;
    savePending(purchase);
    closePurchase();

    // Verify against the merchant wallet without displaying another screen.
    startPolling();
  } catch (error) {
    console.error("[CAPSULE PAYMENT]", error);
    purchaseStatus.textContent = "Payment could not start. Try again.";
    // If submission was interrupted, still check the reference for a late transfer.
    if (purchase && !purchase.signature) startPolling();
  } finally {
    purchasing = false;
    tierButtons.forEach(button => { button.disabled = false; });
  }
}

payButton.onclick = openPurchase;
purchaseClose.onclick = closePurchase;
purchaseOverlay.onclick = event => {
  if (event.target === purchaseOverlay) closePurchase();
};
tierButtons.forEach(button => {
  button.onclick = () => { void buyCapsule(button.dataset.tier); };
});

/* ESCAPE KEY */

document.addEventListener("keydown", event => {
  if (event.key !== "Escape") {
    return;
  }

  if (!purchaseOverlay.hidden) {
    closePurchase();
  } else {
    closeAuth();
  }
});

/* START */

updateSOLPrice();

setInterval(
  updateSOLPrice,
  PRICE_REFRESH_MS
);

document.addEventListener(
  "visibilitychange",
  () => {
    if (!document.hidden) {
      updateSOLPrice();
    }
  }
);

</script>
</body>
</html>
