
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticker Mania</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #090515;
  color: white;
  font-family: Arial, sans-serif;
}

.game-container {
  position: relative;
  width: min(100vw, 700px);
  margin: auto;
  aspect-ratio: 1;
}

.machine {
  width: 100%;
  display: block;
}

.dispenser-container {
  position: absolute;
  left: 30.5%;
  top: 83.5%;
  width: 34%;
  height: 10.5%;
  pointer-events: none;
}

.hotspot {
  position: absolute;
  border: 0;
  background: transparent;
  cursor: pointer;
  color: transparent;
  font-size: 0;
}

.hotspot:focus-visible {
  outline: 3px solid white;
}

/* PAY BUTTON */
.pay-button {
  left: 77.5%;
  top: 27.5%;
  width: 14.3%;
  height: 23.4%;
}

/* SIGN IN BUTTON */
.signin-button {
  left: 78.4%;
  top: 50.4%;
  width: 13%;
  height: 13.4%;
}

/* OVERLAY */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: #05020be0;
  align-items: center;
  justify-content: center;
  z-index: 10;
  padding: 20px;
}

.overlay.open {
  display: flex;
}

.panel {
  position: relative;
  background: #211035;
  border: 2px solid #bd3aff;
  border-radius: 18px;
  padding: 32px;
  width: min(420px, 95vw);
  text-align: center;
}

.close {
  position: absolute;
  top: 10px;
  right: 15px;
  background: none;
  border: none;
  color: white;
  font-size: 28px;
  cursor: pointer;
}

.action {
  background: #d837f2;
  border: none;
  color: white;
  padding: 12px 22px;
  border-radius: 10px;
  cursor: pointer;
}

.action:disabled {
  opacity: 0.6;
  cursor: wait;
}

#auth-status {
  font-size: 13px;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<!-- GAME CONTAINER -->
<div class="game-container" id="game-container">

  <!-- MACHINE IMAGE -->
  <img
    class="machine"
    src="assets/ZetsuStickerZ.png"
    alt="Sticker Mania Machine"
  >

  <!-- DISPENSER CONTAINER -->
  <div
    class="dispenser-container"
    id="dispenser-container">
  </div>

  <!-- BUTTON 1: PAY -->
  <button
    class="hotspot pay-button"
    id="pay-button"
    aria-label="Pay with AWT">
  </button>

  <!-- BUTTON 2: SIGN IN -->
  <button
    class="hotspot signin-button"
    id="signin-button"
    aria-label="Sign in">
  </button>

</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay">
  <div class="panel">

    <button class="close" id="close">×</button>

    <h2 id="overlay-title"></h2>
    <p id="overlay-description"></p>

    <button
      class="action"
      id="discord-auth"
      style="display:none">
      Continue with Discord
    </button>

    <p id="auth-status" role="status"></p>

  </div>
</div>

<script>

// ========================================
// SUPABASE CONFIGURATION
// ========================================

const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

const configured =
  SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("YOUR_") &&
  SUPABASE_KEY.length > 0 &&
  !SUPABASE_KEY.includes("YOUR_");

const client = configured
  ? window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    )
  : null;

let currentUser = null;
let activeOverlay = null;

// ========================================
// ELEMENTS
// ========================================

const overlay = document.getElementById("overlay");
const title = document.getElementById("overlay-title");
const description = document.getElementById("overlay-description");
const authButton = document.getElementById("discord-auth");
const authStatus = document.getElementById("auth-status");

// ========================================
// DISCORD ACCOUNT INFORMATION
// ========================================

function getDiscordUsername(user) {
  if (!user) return "Discord user";

  return (
    user.user_metadata?.custom_claims?.global_name ||
    user.user_metadata?.global_name ||
    user.user_metadata?.preferred_username ||
    user.user_metadata?.user_name ||
    user.user_metadata?.full_name ||
    user.user_metadata?.name ||
    user.email ||
    "Discord user"
  );
}

function getDiscordId(user) {
  if (!user) return null;

  const discordIdentity = user.identities?.find(
    identity => identity.provider === "discord"
  );

  return (
    discordIdentity?.id ||
    discordIdentity?.identity_data?.provider_id ||
    user.user_metadata?.provider_id ||
    user.user_metadata?.sub ||
    null
  );
}

// ========================================
// CREATE OR UPDATE STICKER ACCOUNT
// ========================================

async function syncStickerAccount(user) {
  if (!client || !user) return;

  const account = {
    id: user.id,
    discord_id: getDiscordId(user),
    username: getDiscordUsername(user),
    updated_at: new Date().toISOString()
  };

  // First check whether the account exists.
  const { data: existing, error: lookupError } =
    await client
      .from("sticker_accounts")
      .select("id")
      .eq("id", user.id)
      .maybeSingle();

  if (lookupError) {
    console.error("Account lookup failed:", lookupError);
    throw lookupError;
  }

  if (existing) {

    const { error } = await client
      .from("sticker_accounts")
      .update({
        discord_id: account.discord_id,
        username: account.username,
        updated_at: account.updated_at
      })
      .eq("id", user.id);

    if (error) throw error;

  } else {

    const { error } = await client
      .from("sticker_accounts")
      .insert(account);

    if (error) throw error;
  }
}

// ========================================
// OPEN OVERLAY
// ========================================

function openOverlay(type) {

  activeOverlay = type;
  authStatus.textContent = "";

  if (type === "pay") {

    title.textContent = "PAY WITH $AWT";
    description.textContent = "Payment integration pending.";
    authButton.style.display = "none";

  } else {

    title.textContent = "SIGN IN";
    authButton.style.display = "inline-block";

    if (currentUser) {

      description.textContent =
        "Signed in as " + getDiscordUsername(currentUser);

      authButton.textContent = "Sign Out";

    } else {

      description.textContent =
        "Sign in with your Discord account.";

      authButton.textContent = "Continue with Discord";

      if (!client) {
        authStatus.textContent =
          "Configure Supabase to enable sign-in.";
      }
    }
  }

  overlay.classList.add("open");
}

// ========================================
// CLOSE OVERLAY
// ========================================

function closeOverlay() {
  overlay.classList.remove("open");
  activeOverlay = null;
}

// ========================================
// DISCORD AUTHENTICATION
// ========================================

authButton.onclick = async () => {

  if (!client) {
    authStatus.textContent =
      "Supabase configuration required.";
    return;
  }

  authButton.disabled = true;

  try {

    if (currentUser) {

      const { error } = await client.auth.signOut();

      if (error) throw error;

      currentUser = null;
      openOverlay("signin");

    } else {

      const { error } =
        await client.auth.signInWithOAuth({
          provider: "discord",
          options: {
            redirectTo:
              window.location.origin +
              window.location.pathname,
            scopes: "identify"
          }
        });

      if (error) throw error;
    }

  } catch (error) {

    authStatus.textContent = error.message;
    console.error("Discord authentication error:", error);

  } finally {

    authButton.disabled = false;

  }
};

// ========================================
// HANDLE AUTHENTICATED USER
// ========================================

let lastSyncedUserId = null;
let syncingUserId = null;

async function handleAuthenticatedUser(user) {

  currentUser = user;

  if (!user) {
    lastSyncedUserId = null;
    syncingUserId = null;

    if (activeOverlay === "signin") {
      openOverlay("signin");
    }

    return;
  }

  if (activeOverlay === "signin") {
    openOverlay("signin");
  }

  // Avoid duplicate writes from simultaneous auth events.
  if (
    lastSyncedUserId === user.id ||
    syncingUserId === user.id
  ) {
    return;
  }

  syncingUserId = user.id;

  try {

    await syncStickerAccount(user);

    if (currentUser?.id === user.id) {
      lastSyncedUserId = user.id;
    }

    console.log(
      "Sticker Mania account synchronized:",
      user.id
    );

  } catch (error) {

    console.error(
      "Sticker Mania account sync error:",
      error
    );

    if (
      currentUser?.id === user.id &&
      activeOverlay === "signin"
    ) {
      authStatus.textContent =
        "Signed in, but account sync failed: " +
        error.message;
    }

  } finally {

    if (syncingUserId === user.id) {
      syncingUserId = null;
    }

  }
}

// ========================================
// RESTORE SESSION
// ========================================

if (client) {

  // Listen for sign-in, sign-out, and restored sessions.
  client.auth.onAuthStateChange((event, session) => {

    if (
      event === "INITIAL_SESSION" ||
      event === "SIGNED_IN" ||
      event === "SIGNED_OUT" ||
      event === "USER_UPDATED"
    ) {

      // Defer database operations until after
      // Supabase finishes processing the auth event.
      setTimeout(() => {
        handleAuthenticatedUser(session?.user || null);
      }, 0);

    }
  });

}

// ========================================
// BUTTON EVENTS
// ========================================

document.getElementById("pay-button").onclick =
  () => openOverlay("pay");

document.getElementById("signin-button").onclick =
  () => openOverlay("signin");

document.getElementById("close").onclick =
  closeOverlay;

overlay.onclick = (event) => {
  if (event.target === overlay) {
    closeOverlay();
  }
};

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    closeOverlay();
  }
});

</script>

</body>
</html>
