
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sticker Mania</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  background: #090515;
  color: white;
  font-family: Arial, sans-serif;
}

/* VENDING MACHINE */

.arcade-viewport {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  background: radial-gradient(
    ellipse at center,
    #24113f 0%,
    #10071f 55%,
    #05030c 100%
  );
}

.arcade-container {
  position: relative;
  width: min(100%, 900px, calc(100dvh - 24px));
  aspect-ratio: 1 / 1;
  border: 2px solid #543184;
  border-radius: 18px;
  background: #080412;
  overflow: hidden;
}

.game-container {
  position: relative;
  width: 100%;
  height: 100%;
}

.machine {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.dispenser-container {
  position: absolute;
  left: 30.5%;
  top: 83.5%;
  width: 34%;
  height: 10.5%;
  pointer-events: none;
}

/* SMALL LIVE PRICE LABEL */

.awt-price-tag {
  position: absolute;
  z-index: 3;
  top: 2%;
  right: 2%;
  width: auto;
  max-width: 32%;
  padding: 3px 6px;
  background: rgba(9, 5, 26, 0.88);
  border: 1px solid #a94bdf;
  border-radius: 4px;
  color: #67ffca;
  font-size: clamp(8px, 1.3vw, 12px);
  font-weight: bold;
  line-height: 1.2;
  text-align: center;
  white-space: nowrap;
  pointer-events: none;
}

.awt-price-tag.unavailable {
  color: #ffaaaa;
}

/* VENDING MACHINE BUTTONS */

.hotspot {
  position: absolute;
  z-index: 2;
  border: 0;
  padding: 0;
  background: transparent;
  cursor: pointer;
  color: transparent;
  font-size: 0;
}

.hotspot:focus-visible,
.purchase-hotspot:focus-visible {
  outline: 3px solid white;
}

.pay-button {
  left: 77.5%;
  top: 27.5%;
  width: 14.3%;
  height: 23.4%;
}

.signin-button {
  left: 78.4%;
  top: 50.4%;
  width: 13%;
  height: 13.4%;
  overflow: hidden;
}

/* COLLECTION BUTTON */

.collection-button {
  display: none;
  width: 100%;
  height: 100%;
  background: #090c32;
  border: 2px solid #527cff;
  border-radius: 10px;
  box-shadow: 0 0 10px #315dff;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 5px;
  padding: 5px;
}

.signin-button.signed-in .collection-button {
  display: flex;
}

.collection-avatar {
  width: 48%;
  aspect-ratio: 1;
  border-radius: 50%;
  object-fit: cover;
  background: #29235d;
}

.collection-label {
  color: white;
  font-size: clamp(6px, 1.3vw, 10px);
  font-weight: bold;
  text-align: center;
  text-shadow: 0 0 5px #527cff;
}

/* AUTHENTICATION */

.auth-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(5, 2, 11, 0.91);
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.auth-overlay.open {
  display: flex;
}

.auth-panel {
  position: relative;
  width: min(420px, 95vw);
  background: #211035;
  border: 2px solid #bd3aff;
  border-radius: 18px;
  padding: 32px;
  text-align: center;
  box-shadow: 0 0 30px #8c24d455;
}

.auth-close {
  position: absolute;
  top: 10px;
  right: 15px;
  border: 0;
  background: none;
  color: white;
  font-size: 28px;
  cursor: pointer;
}

.auth-action {
  background: #d837f2;
  border: 0;
  color: white;
  padding: 12px 22px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
}

.auth-action:disabled {
  opacity: 0.5;
}

#auth-status {
  font-size: 13px;
  overflow-wrap: anywhere;
}

/* CAPSULE PURCHASE MENU */

.purchase-overlay {
  position: fixed;
  inset: 0;
  z-index: 15;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  background: rgba(5, 2, 11, 0.85);
}

.purchase-overlay[hidden],
.payment-panel[hidden] {

}

.purchase-modal {

  width: min(94vw, 760px, 132dvh);

.purchase-art {

}

.purchase-hotspot {

  z-index: 2;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
}

.purchase-hotspot:disabled {

}

.purchase-common {

  top: 65%;
  width: 21%;
  height: 11%;
}

.purchase-rare {
  left: 40%;
  top: 65%;
  width: 20%;
  height: 11%;
}

.purchase-legendary {
  left: 67%;
  top: 65%;
  width: 20%;
  height: 11%;
}

.purchase-close {
  right: 8.3%;
  top: 8.5%;
  width: 5%;
  height: 7%;
}

.purchase-status {
  position: absolute;
  left: 12%;
  bottom: 2%;
  width: 76%;
  margin: 0;
  color: white;
  font-size: clamp(9px, 1.4vw, 13px);
  text-align: center;
  text-shadow: 0 0 8px #bd3aff;
  overflow-wrap: anywhere;
  pointer-events: none;
}

/* SMALL PRICE INSIDE PURCHASE MENU */

.purchase-awt-price {
  position: absolute;
  z-index: 3;
  top: 2%;
  left: 2%;
  padding: 3px 6px;
  border: 1px solid #a94bdf;
  border-radius: 4px;
  background: rgba(9, 5, 26, 0.88);
  color: #67ffca;
  font-size: clamp(8px, 1.3vw, 12px);
  font-weight: bold;
  line-height: 1.2;
  white-space: nowrap;
  pointer-events: none;
}

.purchase-awt-price.unavailable {
  color: #ffaaaa;
}

/* SOLANA PAY */

.payment-panel {
  position: absolute;
  inset: 4%;
  z-index: 5;
  background: rgba(9, 5, 22, 0.98);
  border: 2px solid #bd3aff;
  border-radius: 12px;
  padding: 12px;
  text-align: center;
  overflow-y: auto;
  box-shadow: 0 0 25px #bd3aff77;
}

.payment-panel h2 {
  margin: 6px 0;
  font-size: clamp(15px, 2.5vw, 23px);
}

.payment-panel p {
  font-size: clamp(11px, 1.6vw, 14px);
  overflow-wrap: anywhere;
}

.payment-amount {
  color: #f6d2ff;
  font-size: clamp(16px, 3vw, 24px);
  font-weight: bold;
}

#payment-qr {
  display: block;
  width: min(42%, 180px);
  height: auto;
  aspect-ratio: 1;
  margin: 10px auto;
  background: white;
  padding: 7px;
  border-radius: 8px;
}

.payment-actions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
}

.payment-actions button,
.payment-actions a {
  display: inline-block;
  padding: 9px 12px;
  background: #ae2bdd;
  border: 0;
  border-radius: 7px;
  color: white;
  text-decoration: none;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
}

.payment-actions .secondary {
  background: #383050;
}

#payment-message {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.payment-error {
  color: #ff9f9f;
}

/* MOBILE */

@media (max-width: 600px) {
  .arcade-viewport {
    padding: 4px;
  }

  .arcade-container {
    width: min(100%, calc(100dvh - 8px));
    border-width: 1px;
    border-radius: 8px;
  }

  .awt-price-tag {
    padding: 2px 4px;
    border-radius: 3px;
    font-size: 8px;
  }

  .purchase-awt-price {
    padding: 2px 4px;
    border-radius: 3px;
    font-size: 8px;
  }

  .collection-button {
    border-radius: 5px;
    border-width: 1px;
    gap: 2px;
    padding: 2px;
  }

  .collection-label {
    font-size: clamp(5px, 1.8vw, 9px);
  }

  .auth-panel {
    padding: 25px 18px;
  }

  .purchase-overlay {
    padding: 5px;
  }

  .purchase-modal {
    width: min(98vw, 132dvh);
    border-width: 1px;
    border-radius: 7px;
  }

  .purchase-status {
    font-size: 8px;
  }

  .payment-panel {
    padding: 7px;
  }

  .payment-panel p {
    margin: 6px 0;
  }

  #payment-qr {
    width: min(35%, 130px);
    margin: 5px auto;
  }

  .payment-actions button,
  .payment-actions a {
    padding: 6px;
    font-size: 10px;
  }
}
</style>
</head>

<script>
/* CONFIGURATION */

const SUPABASE_URL =
  "https://jqvnrdjrkdjgjbmqmbbl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_jmEahTk4OssD_IrOZq_6iQ_P6QFFJr6";

const AWT_MINT =
  "ETvGFek4eDeHP7iC7yceGpduTRypHpsUT6tybwMXpump";

const RECEIVER =
  "CT1fjjJMaNb2jgwH7rnuyiLcASmtmdRzSw7tQv8VXaRK";

const CAPSULE_PRICES = Object.freeze({
  common: 0.50,
  rare: 1.00,
  legendary: 3.00
});

const PRICE_FUNCTION = "awt-price";
const PURCHASE_FUNCTION = "purchase-capsule";
const VERIFY_FUNCTION = "verify-capsule";

const PRICE_REFRESH_MS = 60000;
const PAYMENT_CHECK_MS = 6000;

const PENDING_KEY = "sticker_mania_pending";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const ACCOUNT_URL =
  new URL("account.html", window.location.href).href;

let currentUser = null;
let activePurchase = null;
let paymentTimer = null;

let checkingPayment = false;
let creatingPurchase = false;

let currentAWTPrice = null;
let priceRequestRunning = false;

const $ = id => document.getElementById(id);

/* ELEMENTS */

const authOverlay = $("auth-overlay");
const authButton = $("discord-auth");
const authStatus = $("auth-status");

const signinButton = $("signin-button");
const collectionAvatar = $("collection-avatar");

const purchaseOverlay = $("purchase-overlay");
const purchaseStatus = $("purchase-status");

const payButton = $("pay-button");
const purchaseClose = $("purchase-close");

const paymentPanel = $("payment-panel");

const paymentTitle = $("payment-title");
const paymentUsd = $("payment-usd");
const paymentAwt = $("payment-awt");
const paymentMessage = $("payment-message");
const paymentQr = $("payment-qr");

const paymentWallet = $("payment-wallet");
const paymentCopy = $("payment-copy");
const paymentCheck = $("payment-check");
const paymentBack = $("payment-back");

const awtPriceMain = $("awt-price-main");
const awtPricePurchase = $("awt-price-purchase");

const tierButtons = [
  ...document.querySelectorAll("[data-tier]")
];

/* READ ACTUAL EDGE FUNCTION ERRORS */

async function getFunctionError(error) {
  if (!error) {
    return "Unknown error";
  }

  let message = error.message || String(error);
  const context = error.context;

  if (context instanceof Response) {
    const status = context.status;

    try {
      const body = await context.clone().text();

      if (body) {
        try {
          const parsed = JSON.parse(body);

          message =
            parsed.error ||
            parsed.message ||
            parsed.msg ||
            JSON.stringify(parsed);

        } catch {
          message = body;
        }
      }

    } catch (readError) {
      console.error(
        "Could not read error response:",
        readError
      );
    }

    return "HTTP " + status + ": " + message;
  }

  if (context?.message) {
    message += ": " + context.message;
  }

  return message;
}

/* LIVE AWT PRICE DISPLAY */

function formatAWTPrice(price) {
  return "$" + new Intl.NumberFormat("en-US", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 12
  }).format(price);
}

function setAWTPriceDisplay(
  value,
  unavailable = false
) {
  for (const element of [
    awtPriceMain,
    awtPricePurchase
  ]) {
    element.textContent = value;

    element.classList.toggle(
      "unavailable",
      unavailable
    );
  }
}

async function refreshAWTPrice() {
  if (priceRequestRunning) {
    return currentAWTPrice;
  }

  priceRequestRunning = true;

  try {
    const { data, error } =
      await client.functions.invoke(
        PRICE_FUNCTION,
        {
          method: "POST",
          body: {
            mint: AWT_MINT
          }
        }
      );

    if (error) {
      throw new Error(
        await getFunctionError(error)
      );
    }

    if (!data || data.success !== true) {
      throw new Error(
        data?.error || "Price lookup failed"
      );
    }

    if (data.mint !== AWT_MINT) {
      throw new Error(
        "Price belongs to the wrong token"
      );
    }

    const price = Number(data.priceUsd);

    if (
      !Number.isFinite(price) ||
      price <= 0
    ) {
      throw new Error(
        "Invalid AWT price"
      );
    }

    currentAWTPrice = price;

    setAWTPriceDisplay(
      formatAWTPrice(price)
    );

    console.log(
      "[AWT PRICE]",
      price,
      "USD"
    );

    return price;

  } catch (error) {
    currentAWTPrice = null;

    setAWTPriceDisplay(
      "N/A",
      true
    );

    console.error(
      "[AWT PRICE ERROR]",
      error.message
    );

    return null;

  } finally {
    priceRequestRunning = false;
  }
}

/* PURCHASE AND PAYMENT MESSAGES */

function showPurchaseError(message) {
  purchaseStatus.textContent = message;
  purchaseStatus.title = message;

  console.error(
    "[STICKER MANIA]",
    message
  );
}

function showPaymentMessage(
  message,
  isError = false
) {
  paymentMessage.textContent = message;

  paymentMessage.classList.toggle(
    "payment-error",
    isError
  );
}

/* DISCORD ACCOUNT */

function getDiscordUsername(user) {
  return (
    user?.user_metadata?.custom_claims?.global_name ||
    user?.user_metadata?.global_name ||
    user?.user_metadata?.preferred_username ||
    user?.user_metadata?.user_name ||
    user?.user_metadata?.full_name ||
    user?.user_metadata?.name ||
    user?.email ||
    "Discord user"
  );
}

function getDiscordId(user) {
  const identity = user?.identities?.find(
    item => item.provider === "discord"
  );

  return (
    identity?.id ||
    identity?.identity_data?.provider_id ||
    user?.user_metadata?.provider_id ||
    user?.user_metadata?.sub ||
    null
  );
}

function updateAccountButton() {
  const signedIn = !!currentUser;

  signinButton.classList.toggle(
    "signed-in",
    signedIn
  );

  signinButton.setAttribute(
    "aria-label",
    signedIn
      ? "View My Collection"
      : "Sign in with Discord"
  );

  const avatar =
    currentUser?.user_metadata?.avatar_url;

  if (signedIn && avatar) {
    collectionAvatar.src = avatar;
    collectionAvatar.style.display = "block";

  } else {
    collectionAvatar.removeAttribute("src");
    collectionAvatar.style.display = "none";
  }
}

async function syncStickerAccount(user) {
  if (!user) return;

  const { error } = await client
    .from("sticker_accounts")
    .upsert({
      id: user.id,
      discord_id: getDiscordId(user),
      username: getDiscordUsername(user),
      updated_at: new Date().toISOString()
    }, {
      onConflict: "id"
    });

  if (error) {
    throw error;
  }
}

function openSignIn() {
  authStatus.textContent = "";
  authOverlay.classList.add("open");
}

function closeSignIn() {
  authOverlay.classList.remove("open");
}

async function goToAccount() {
  if (!currentUser) {
    openSignIn();
    return;
  }

  try {
    await syncStickerAccount(currentUser);

    window.location.href = ACCOUNT_URL;

  } catch (error) {
    console.error(error);

    openSignIn();

    authStatus.textContent =
      "Account sync failed: " +
      error.message;
  }
}

authButton.onclick = async () => {
  authButton.disabled = true;
  authStatus.textContent = "";

  try {
    const { error } =
      await client.auth.signInWithOAuth({
        provider: "discord",
        options: {
          redirectTo: ACCOUNT_URL,
          scopes: "identify"
        }
      });

    if (error) {
      throw error;
    }

  } catch (error) {
    authStatus.textContent = error.message;

  } finally {
    authButton.disabled = false;
  }
};

signinButton.onclick = goToAccount;

async function restoreSession() {
  const { data, error } =
    await client.auth.getUser();

  if (error) {
    console.error(
      "Session error:",
      error
    );

    return;
  }

  currentUser = data.user || null;

  updateAccountButton();
}

client.auth.onAuthStateChange(
  (event, session) => {
    const previousId = currentUser?.id;

    currentUser = session?.user || null;

    updateAccountButton();

    if (
      previousId &&
      previousId !== currentUser?.id
    ) {
      stopPaymentPolling();

      activePurchase = null;
      paymentPanel.hidden = true;
    }

    if (
      event === "SIGNED_IN" &&
      currentUser
    ) {
      const user = currentUser;

      setTimeout(() => {
        syncStickerAccount(user).catch(
          console.error
        );
      }, 0);
    }
  }
);

void restoreSession();

$("auth-close").onclick = closeSignIn;

authOverlay.onclick = event => {
  if (event.target === authOverlay) {
    closeSignIn();
  }
};

/* AUTHENTICATED EDGE FUNCTIONS */

async function invokeFunction(name, body) {
  const {
    data: sessionData,
    error: sessionError
  } = await client.auth.getSession();

  if (sessionError) {
    throw sessionError;
  }

  const token =
    sessionData.session?.access_token;

  if (!token) {
    throw new Error(
      "Discord session missing. Sign in again."
    );
  }

  const { data, error } =
    await client.functions.invoke(name, {
      body,
      headers: {
        Authorization: "Bearer " + token
      }
    });

  if (error) {
    throw new Error(
      await getFunctionError(error)
    );
  }

  if (
    !data ||
    typeof data !== "object"
  ) {
    throw new Error(
      name + " returned an invalid response."
    );
  }

  if (data.error) {
    throw new Error(
      String(data.error)
    );
  }

  return data;
}

/* PURCHASE STORAGE */

function pendingStorageKey() {
  return (
    PENDING_KEY + "_" +
    (currentUser?.id || "anonymous")
  );
}

function savePending(purchase) {
  localStorage.setItem(
    pendingStorageKey(),
    JSON.stringify(purchase)
  );
}

function loadPending() {
  try {
    const raw = localStorage.getItem(
      pendingStorageKey()
    );

    return raw
      ? JSON.parse(raw)
      : null;

  } catch {
    return null;
  }
}

function clearPending() {
  localStorage.removeItem(
    pendingStorageKey()
  );
}

/* PAYMENT TIMER */

function stopPaymentPolling() {
  if (paymentTimer !== null) {
    clearInterval(paymentTimer);
    paymentTimer = null;
  }
}

function startPaymentPolling() {
  stopPaymentPolling();

  paymentTimer = setInterval(() => {
    if (
      activePurchase &&
      !purchaseOverlay.hidden &&
      !paymentPanel.hidden
    ) {
      void verifyPayment();
    }
  }, PAYMENT_CHECK_MS);
}

/* VALIDATE PAYMENT RESPONSE */

function validatePaymentResponse(
  data,
  tier
) {
  if (
    !data.purchaseId ||
    typeof data.purchaseId !== "string"
  ) {
    throw new Error(
      "Backend did not return a purchase ID."
    );
  }

  if (
    !data.paymentUrl ||
    typeof data.paymentUrl !== "string"
  ) {
    throw new Error(
      "Backend did not return a Solana Pay URL."
    );
  }

  if (
    !data.reference ||
    typeof data.reference !== "string"
  ) {
    throw new Error(
      "Backend did not return a payment reference."
    );
  }

  const amount = Number(
    data.awtAmount
  );

  if (
    !Number.isFinite(amount) ||
    amount <= 0
  ) {
    throw new Error(
      "Backend returned an invalid AWT amount."
    );
  }

  if (
    Number(data.priceUsd) !==
    CAPSULE_PRICES[tier]
  ) {
    throw new Error(
      "Backend returned an incorrect capsule price."
    );
  }

  const url = new URL(
    data.paymentUrl
  );

  if (url.protocol !== "solana:") {
    throw new Error(
      "Invalid Solana Pay protocol."
    );
  }

  if (url.pathname !== RECEIVER) {
    throw new Error(
      "Incorrect payment recipient."
    );
  }

  if (
    url.searchParams.get("spl-token") !==
    AWT_MINT
  ) {
    throw new Error(
      "Incorrect payment token."
    );
  }

  if (
    url.searchParams.get("reference") !==
    data.reference
  ) {
    throw new Error(
      "Payment reference mismatch."
    );
  }

  if (
    Number(
      url.searchParams.get("amount")
    ) !== amount
  ) {
    throw new Error(
      "Payment amount mismatch."
    );
  }

  return true;
}

/* DISPLAY SOLANA PAY */

async function showPayment(purchase) {
  activePurchase = purchase;

  paymentPanel.hidden = false;

  paymentTitle.textContent =
    purchase.tier.toUpperCase() +
    " CAPSULE";

  paymentUsd.textContent =
    "$" +
    Number(purchase.priceUsd).toFixed(2) +
    " USD";

  paymentAwt.textContent =
    String(purchase.awtAmount) +
    " $AWT";

  paymentWallet.href =
    purchase.paymentUrl;

  paymentWallet.hidden = false;
  paymentCopy.hidden = false;
  paymentCheck.hidden = false;

  showPaymentMessage(
    "Scan the QR code with a Solana Pay wallet " +
    "or open the payment link."
  );

  try {
    if (!window.QRCode) {
      throw new Error(
        "QR library unavailable"
      );
    }

    await window.QRCode.toCanvas(
      paymentQr,
      purchase.paymentUrl,
      {
        width: 220,
        margin: 2,
        errorCorrectionLevel: "M"
      }
    );

    paymentQr.hidden = false;

  } catch (error) {
    paymentQr.hidden = true;

    showPaymentMessage(
      "QR unavailable. Use OPEN WALLET " +
      "or COPY LINK. " +
      error.message,
      true
    );
  }

  startPaymentPolling();
}

/* VERIFY PAYMENT */

async function verifyPayment() {
  if (
    !activePurchase ||
    checkingPayment ||
    !currentUser
  ) {
    return;
  }

  checkingPayment = true;

  const purchaseId =
    activePurchase.purchaseId;

  paymentCheck.disabled = true;

  try {
    const result = await invokeFunction(
      VERIFY_FUNCTION,
      { purchaseId }
    );

    if (
      !activePurchase ||
      activePurchase.purchaseId !== purchaseId
    ) {
      return;
    }

    if (
      result.status === "fulfilled"
    ) {
      stopPaymentPolling();
      clearPending();

      const capsule = result.capsule;

      paymentTitle.textContent =
        "CAPSULE RECEIVED";

      if (capsule) {
        paymentAwt.textContent =
          "CAPSULE #" +
          capsule.id;

        showPaymentMessage(
          "YOU RECEIVED: " +
          capsule.reward_name +
          "\nTYPE: " +
          capsule.reward_type.toUpperCase()
        );

      } else {
        showPaymentMessage(
          "Payment verified and purchase fulfilled."
        );
      }

      paymentWallet.hidden = true;
      paymentCopy.hidden = true;
      paymentCheck.hidden = true;
      paymentQr.hidden = true;

      return;
    }

    if (
      result.status === "pending"
    ) {
      showPaymentMessage(
        result.message ||
        "Waiting for Solana payment confirmation..."
      );

      return;
    }

    showPaymentMessage(
      "Backend returned: " +
      JSON.stringify(result),
      true
    );

  } catch (error) {
    console.error(
      "PAYMENT VERIFICATION ERROR:",
      error
    );

    showPaymentMessage(
      "VERIFY ERROR: " +
      error.message,
      true
    );

  } finally {
    checkingPayment = false;
    paymentCheck.disabled = false;
  }
}

/* BUY CAPSULE */

async function buyCapsule(tier) {
  if (creatingPurchase) return;

  if (!currentUser) {
    closePurchase();
    openSignIn();
    return;
  }

  const existing = loadPending();

  if (
    existing?.purchaseId &&
    existing?.paymentUrl
  ) {
    try {
      validatePaymentResponse(
        existing,
        existing.tier
      );

      await showPayment(existing);
      await verifyPayment();

    } catch (error) {
      showPurchaseError(
        "PENDING PURCHASE ERROR: " +
        error.message
      );
    }

    return;
  }

  creatingPurchase = true;

  tierButtons.forEach(
    button => {
      button.disabled = true;
    }
  );

  purchaseStatus.textContent =
    "Creating purchase...";

  try {
    await refreshAWTPrice();

    if (currentAWTPrice === null) {
      throw new Error(
        "Cannot retrieve the current AWT price."
      );
    }

    const result = await invokeFunction(
      PURCHASE_FUNCTION,
      { tier }
    );

    validatePaymentResponse(
      result,
      tier
    );

    const purchase = {
      purchaseId: result.purchaseId,
      tier,
      priceUsd: result.priceUsd,
      awtAmount: result.awtAmount,
      awtUsd: result.awtUsd,
      paymentUrl: result.paymentUrl,
      reference: result.reference,
      expiresAt: result.expiresAt
    };

    savePending(purchase);

    purchaseStatus.textContent = "";

    await showPayment(purchase);

  } catch (error) {
    console.error(
      "PURCHASE CREATION ERROR:",
      error
    );

    showPurchaseError(
      "PURCHASE ERROR: " +
      error.message
    );

  } finally {
    creatingPurchase = false;

    tierButtons.forEach(
      button => {
        button.disabled = false;
      }
    );
  }
}

/* PURCHASE MENU */

async function openPurchase() {
  purchaseOverlay.hidden = false;

  purchaseStatus.textContent = "";
  paymentPanel.hidden = true;

  void refreshAWTPrice();

  if (currentUser) {
    const pending = loadPending();

    if (
      pending?.purchaseId &&
      pending?.paymentUrl
    ) {
      try {
        validatePaymentResponse(
          pending,
          pending.tier
        );

        await showPayment(pending);
        await verifyPayment();

      } catch (error) {
        showPurchaseError(
          "PENDING PURCHASE ERROR: " +
          error.message
        );
      }
    }
  }
}

function closePurchase() {
  stopPaymentPolling();

  purchaseOverlay.hidden = true;
  paymentPanel.hidden = true;
  purchaseStatus.textContent = "";

  payButton.focus();
}

payButton.onclick = () => {
  void openPurchase();
};

purchaseClose.onclick =
  closePurchase;

purchaseOverlay.onclick = event => {
  if (
    event.target === purchaseOverlay
  ) {
    closePurchase();
  }
};

tierButtons.forEach(button => {
  button.onclick = () => {
    void buyCapsule(
      button.dataset.tier
    );
  };
});

/* PAYMENT ACTIONS */

paymentCopy.onclick = async () => {
  if (!activePurchase) return;

  try {
    await navigator.clipboard.writeText(
      activePurchase.paymentUrl
    );

    showPaymentMessage(
      "Solana Pay link copied."
    );

  } catch (error) {
    showPaymentMessage(
      "Copy failed: " +
      error.message,
      true
    );
  }
};

paymentCheck.onclick = () => {
  void verifyPayment();
};

paymentBack.onclick = () => {
  stopPaymentPolling();

  paymentPanel.hidden = true;
  purchaseStatus.textContent = "";
};

/* CLOSE OVERLAYS */

document.addEventListener(
  "keydown",
  event => {
    if (event.key !== "Escape") {
      return;
    }

    if (!purchaseOverlay.hidden) {
      closePurchase();
    } else {
      closeSignIn();
    }
  }
);

/* START LIVE AWT PRICE */

void refreshAWTPrice();

setInterval(() => {
  void refreshAWTPrice();
}, PRICE_REFRESH_MS);

document.addEventListener(
  "visibilitychange",
  () => {
    if (!document.hidden) {
      void refreshAWTPrice();
    }
  }
);
</script>
