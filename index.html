
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticker Mania</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

html {
  width: 100%;
  min-height: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: #090515;
  color: white;
  font-family: Arial, sans-serif;
}

/* ARCADE */

.arcade-viewport {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  overflow-x: hidden;
  background: radial-gradient(
    ellipse at center,
    #24113f 0%,
    #10071f 55%,
    #05030c 100%
  );
}

.arcade-container {
  position: relative;
  width: min(100%, 900px, calc(100dvh - 24px));
  aspect-ratio: 1 / 1;
  flex: 0 1 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #543184;
  border-radius: 18px;
  background: #080412;
  box-shadow:
    0 0 18px #5c28a455,
    0 0 55px #35116b44,
    inset 0 0 22px #52218c33;
  overflow: hidden;
}

.game-container {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  flex-shrink: 0;
}

.machine {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
}

/* DISPENSER */

.dispenser-container {
  position: absolute;
  left: 30.5%;
  top: 83.5%;
  width: 34%;
  height: 10.5%;
  pointer-events: none;
}

/* MACHINE BUTTONS */

.hotspot {
  position: absolute;
  border: 0;
  background: transparent;
  cursor: pointer;
  color: transparent;
  font-size: 0;
  z-index: 2;
}

.hotspot:focus-visible {
  outline: 3px solid white;
}

.pay-button {
  left: 77.5%;
  top: 27.5%;
  width: 14.3%;
  height: 23.4%;
}

.signin-button {
  left: 78.4%;
  top: 50.4%;
  width: 13%;
  height: 13.4%;
  padding: 0;
  overflow: hidden;
}

/* COLLECTION BUTTON */

.collection-button {
  display: none;
  width: 100%;
  height: 100%;
  background: #090c32;
  border: 2px solid #527cff;
  border-radius: 10px;
  box-shadow: 0 0 10px #315dff;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 5px;
  padding: 5px;
}

.signin-button.signed-in .collection-button {
  display: flex;
}

.collection-avatar {
  width: 48%;
  aspect-ratio: 1;
  border-radius: 50%;
  object-fit: cover;
  background: #29235d;
}

.collection-label {
  color: white;
  font-size: clamp(6px, 1.3vw, 10px);
  font-weight: bold;
  text-align: center;
  text-shadow: 0 0 5px #527cff;
}

/* SIGN IN MODAL */

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: #05020be8;
  align-items: center;
  justify-content: center;
  z-index: 10;
  padding: 16px;
}

.overlay.open {
  display: flex;
}

.panel {
  position: relative;
  background: #211035;
  border: 2px solid #bd3aff;
  border-radius: 18px;
  padding: 32px;
  width: min(420px, 95vw);
  max-height: 90dvh;
  overflow-y: auto;
  text-align: center;
  box-shadow: 0 0 30px #8c24d455;
}

.close {
  position: absolute;
  top: 10px;
  right: 15px;
  background: none;
  border: none;
  color: white;
  font-size: 28px;
  cursor: pointer;
}

.action {
  background: #d837f2;
  border: none;
  color: white;
  padding: 12px 22px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
}

.action:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

#auth-status {
  font-size: 13px;
  overflow-wrap: anywhere;
}

/* MOBILE */

@media (max-width: 600px) {
  .arcade-viewport {
    padding: 4px;
  }

  .arcade-container {
    width: min(100%, calc(100dvh - 8px));
    border-radius: 8px;
    border-width: 1px;
  }

  .collection-button {
    border-radius: 5px;
    border-width: 1px;
    gap: 2px;
    padding: 2px;
  }

  .collection-label {
    font-size: clamp(5px, 1.8vw, 9px);
  }

  .panel {
    padding: 25px 18px;
  }
}
</style>
</head>

<body>

<!-- ARCADE -->
<main class="arcade-viewport">

  <div class="arcade-container">

    <div class="game-container" id="game-container">

      <img
        class="machine"
        src="assets/ZetsuStickerZ.png"
        alt="Sticker Mania Machine"
      >

      <div
        class="dispenser-container"
        id="dispenser-container">
      </div>

      <button
        class="hotspot pay-button"
        id="pay-button"
        aria-label="Pay with AWT">
      </button>

      <button
        class="hotspot signin-button"
        id="signin-button"
        aria-label="Sign in with Discord">

        <span class="collection-button" id="collection-button">
          <img
            class="collection-avatar"
            id="collection-avatar"
            alt="Discord Profile"
          >
          <span class="collection-label">
            MY COLLECTION
          </span>
        </span>

      </button>

    </div>

  </div>

</main>

<!-- SIGN IN MODAL -->
<div class="overlay" id="overlay">
  <div class="panel">

    <button class="close" id="close" aria-label="Close">×</button>

    <h2>SIGN IN</h2>

    <p>
      Sign in with Discord to access your
      Sticker Mania account.
    </p>

    <button class="action" id="discord-auth">
      Continue with Discord
    </button>

    <p id="auth-status" role="status"></p>

  </div>
</div>

<script>

// SUPABASE CONFIGURATION

const SUPABASE_URL =
  "https://jqvnrdjrkdjgjbmqmbbl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_jmEahTk4OssD_IrOZq_6iQ_P6QFFJr6";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const ACCOUNT_URL = new URL(
  "account.html",
  window.location.href
).href;

const PURCHASE_URL = new URL(
  "purchase.html",
  window.location.href
).href;

let currentUser = null;

// ELEMENTS

const overlay = document.getElementById("overlay");
const authButton = document.getElementById("discord-auth");
const authStatus = document.getElementById("auth-status");

const signinButton = document.getElementById("signin-button");
const collectionAvatar = document.getElementById("collection-avatar");

// DISCORD USER DATA

function getDiscordUsername(user) {
  if (!user) return "Discord user";

  return (
    user.user_metadata?.custom_claims?.global_name ||
    user.user_metadata?.global_name ||
    user.user_metadata?.preferred_username ||
    user.user_metadata?.user_name ||
    user.user_metadata?.full_name ||
    user.user_metadata?.name ||
    user.email ||
    "Discord user"
  );
}

function getDiscordId(user) {
  if (!user) return null;

  const discordIdentity = user.identities?.find(
    identity => identity.provider === "discord"
  );

  return (
    discordIdentity?.id ||
    discordIdentity?.identity_data?.provider_id ||
    user.user_metadata?.provider_id ||
    user.user_metadata?.sub ||
    null
  );
}

function getDiscordAvatar(user) {
  if (!user) return "";

  return user.user_metadata?.avatar_url || "";
}

// COLLECTION BUTTON

function updateAccountButton() {

  if (currentUser) {

    signinButton.classList.add("signed-in");
    signinButton.setAttribute(
      "aria-label",
      "View My Collection"
    );

    const avatarUrl = getDiscordAvatar(currentUser);

    if (avatarUrl) {
      collectionAvatar.src = avatarUrl;
      collectionAvatar.style.display = "block";
    } else {
      collectionAvatar.removeAttribute("src");
      collectionAvatar.style.display = "none";
    }

  } else {

    signinButton.classList.remove("signed-in");
    signinButton.setAttribute(
      "aria-label",
      "Sign in with Discord"
    );

    collectionAvatar.removeAttribute("src");
  }
}

// ACCOUNT SYNC

async function syncStickerAccount(user) {

  if (!user) return;

  const account = {
    id: user.id,
    discord_id: getDiscordId(user),
    username: getDiscordUsername(user),
    updated_at: new Date().toISOString()
  };

  const { error } = await client
    .from("sticker_accounts")
    .upsert(account, {
      onConflict: "id"
    });

  if (error) throw error;
}

// SIGN IN MODAL

function openSignIn() {
  authStatus.textContent = "";
  overlay.classList.add("open");
}

function closeSignIn() {
  overlay.classList.remove("open");
}

// ACCOUNT PAGE

async function goToAccount() {

  if (!currentUser) {
    openSignIn();
    return;
  }

  try {
    await syncStickerAccount(currentUser);
  } catch (error) {

    console.error("Account sync error:", error);
    openSignIn();

    authStatus.textContent =
      "Account sync failed: " + error.message;

    return;
  }

  window.location.href = ACCOUNT_URL;
}

// DISCORD OAUTH

authButton.onclick = async () => {

  authButton.disabled = true;
  authStatus.textContent = "";

  try {

    const { error } =
      await client.auth.signInWithOAuth({
        provider: "discord",
        options: {
          redirectTo: ACCOUNT_URL,
          scopes: "identify"
        }
      });

    if (error) throw error;

  } catch (error) {

    authStatus.textContent = error.message;
    console.error("Discord auth error:", error);

  } finally {
    authButton.disabled = false;
  }
};

// MACHINE BUTTONS

signinButton.onclick = goToAccount;

document.getElementById("pay-button").onclick = () => {
  window.location.href = PURCHASE_URL;
};

// SESSION RESTORATION

async function restoreSession() {

  const { data, error } = await client.auth.getUser();

  if (error) {
    console.error("Session error:", error);
    return;
  }

  currentUser = data.user || null;
  updateAccountButton();
}

client.auth.onAuthStateChange((event, session) => {

  currentUser = session?.user || null;
  updateAccountButton();

  if (event === "SIGNED_IN" && currentUser) {

    const user = currentUser;

    setTimeout(async () => {

      try {
        await syncStickerAccount(user);
      } catch (error) {
        console.error("Account sync error:", error);
      }

    }, 0);
  }
});

restoreSession();

// CLOSE SIGN IN MODAL

document.getElementById("close").onclick =
  closeSignIn;

overlay.onclick = event => {
  if (event.target === overlay) closeSignIn();
};

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeSignIn();
});

</script>

</body>
</html>
