
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticker Mania</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="purchase.css">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  background: #090515;
  color: white;
  font-family: Arial, sans-serif;
}

.arcade-viewport {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  overflow-x: hidden;
  background: radial-gradient(
    ellipse at center,
    #24113f 0%,
    #10071f 55%,
    #05030c 100%
  );
}

.arcade-container {
  position: relative;
  width: min(100%, 900px, calc(100dvh - 24px));
  aspect-ratio: 1 / 1;
  flex: 0 1 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #543184;
  border-radius: 18px;
  background: #080412;
  box-shadow:
    0 0 18px #5c28a455,
    0 0 55px #35116b44,
    inset 0 0 22px #52218c33;
  overflow: hidden;
}

.game-container {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  flex-shrink: 0;
}

.machine {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
}

.dispenser-container {
  position: absolute;
  left: 30.5%;
  top: 83.5%;
  width: 34%;
  height: 10.5%;
  pointer-events: none;
}

.hotspot {
  position: absolute;
  border: 0;
  padding: 0;
  background: transparent;
  cursor: pointer;
  color: transparent;
  font-size: 0;
  z-index: 2;
}

.hotspot:focus-visible {
  outline: 3px solid white;
}

.pay-button {
  left: 77.5%;
  top: 27.5%;
  width: 14.3%;
  height: 23.4%;
}

.signin-button {
  left: 78.4%;
  top: 50.4%;
  width: 13%;
  height: 13.4%;
  overflow: hidden;
}

.collection-button {
  display: none;
  width: 100%;
  height: 100%;
  background: #090c32;
  border: 2px solid #527cff;
  border-radius: 10px;
  box-shadow: 0 0 10px #315dff;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 5px;
  padding: 5px;
}

.signin-button.signed-in .collection-button {
  display: flex;
}

.collection-avatar {
  width: 48%;
  aspect-ratio: 1;
  border-radius: 50%;
  object-fit: cover;
  background: #29235d;
}

.collection-label {
  color: white;
  font-size: clamp(6px, 1.3vw, 10px);
  font-weight: bold;
  text-align: center;
  text-shadow: 0 0 5px #527cff;
}

.auth-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  background: #05020be8;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.auth-overlay.open {
  display: flex;
}

.auth-panel {
  position: relative;
  width: min(420px, 95vw);
  background: #211035;
  border: 2px solid #bd3aff;
  border-radius: 18px;
  padding: 32px;
  text-align: center;
  box-shadow: 0 0 30px #8c24d455;
}

.auth-close {
  position: absolute;
  top: 10px;
  right: 15px;
  border: 0;
  background: none;
  color: white;
  font-size: 28px;
  cursor: pointer;
}

.auth-action {
  background: #d837f2;
  border: 0;
  color: white;
  padding: 12px 22px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
}

.auth-action:disabled {
  opacity: .5;
}

#auth-status {
  font-size: 13px;
  overflow-wrap: anywhere;
}

@media (max-width: 600px) {
  .arcade-viewport { padding: 4px; }

  .arcade-container {
    width: min(100%, calc(100dvh - 8px));
    border-radius: 8px;
    border-width: 1px;
  }

  .collection-button {
    border-radius: 5px;
    border-width: 1px;
    gap: 2px;
    padding: 2px;
  }

  .collection-label {
    font-size: clamp(5px, 1.8vw, 9px);
  }

  .auth-panel {
    padding: 25px 18px;
  }
}
</style>
</head>

<body>

<main class="arcade-viewport">
  <div class="arcade-container">
    <div class="game-container" id="game-container">

      <img
        class="machine"
        src="assets/ZetsuStickerZ.png"
        alt="Sticker Mania Machine"
      >

      <div
        class="dispenser-container"
        id="dispenser-container">
      </div>

      <button
        class="hotspot pay-button"
        id="pay-button"
        aria-label="Pay with AWT">
      </button>

      <button
        class="hotspot signin-button"
        id="signin-button"
        aria-label="Sign in with Discord">

        <span class="collection-button">
          <img
            class="collection-avatar"
            id="collection-avatar"
            alt="Discord Profile"
          >
          <span class="collection-label">
            MY COLLECTION
          </span>
        </span>

      </button>

    </div>
  </div>
</main>

<!-- PURCHASE MODAL IS LOADED HERE -->
<div id="purchase-root"></div>

<!-- DISCORD SIGN IN -->
<div class="auth-overlay" id="auth-overlay">
  <div class="auth-panel">

    <button
      class="auth-close"
      id="auth-close"
      aria-label="Close">
      ×
    </button>

    <h2>SIGN IN</h2>

    <p>
      Sign in with Discord to access your
      Sticker Mania account.
    </p>

    <button class="auth-action" id="discord-auth">
      Continue with Discord
    </button>

    <p id="auth-status" role="status"></p>

  </div>
</div>

<script>
const SUPABASE_URL =
  "https://jqvnrdjrkdjgjbmqmbbl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_jmEahTk4OssD_IrOZq_6iQ_P6QFFJr6";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const ACCOUNT_URL =
  new URL("account.html", location.href).href;

let currentUser = null;

const authOverlay =
  document.getElementById("auth-overlay");

const authButton =
  document.getElementById("discord-auth");

const authStatus =
  document.getElementById("auth-status");

const signinButton =
  document.getElementById("signin-button");

const collectionAvatar =
  document.getElementById("collection-avatar");

function getDiscordUsername(user) {
  return (
    user?.user_metadata?.custom_claims?.global_name ||
    user?.user_metadata?.global_name ||
    user?.user_metadata?.preferred_username ||
    user?.user_metadata?.user_name ||
    user?.user_metadata?.full_name ||
    user?.user_metadata?.name ||
    user?.email ||
    "Discord user"
  );
}

function getDiscordId(user) {
  const identity = user?.identities?.find(
    item => item.provider === "discord"
  );

  return (
    identity?.id ||
    identity?.identity_data?.provider_id ||
    user?.user_metadata?.provider_id ||
    user?.user_metadata?.sub ||
    null
  );
}

function updateAccountButton() {
  const signedIn = !!currentUser;

  signinButton.classList.toggle("signed-in", signedIn);
  signinButton.setAttribute(
    "aria-label",
    signedIn ? "View My Collection" : "Sign in with Discord"
  );

  const avatar = currentUser?.user_metadata?.avatar_url;

  if (signedIn && avatar) {
    collectionAvatar.src = avatar;
    collectionAvatar.style.display = "block";
  } else {
    collectionAvatar.removeAttribute("src");
    collectionAvatar.style.display = "none";
  }
}

async function syncStickerAccount(user) {
  if (!user) return;

  const { error } = await client
    .from("sticker_accounts")
    .upsert({
      id: user.id,
      discord_id: getDiscordId(user),
      username: getDiscordUsername(user),
      updated_at: new Date().toISOString()
    }, {
      onConflict: "id"
    });

  if (error) throw error;
}

function openSignIn() {
  authStatus.textContent = "";
  authOverlay.classList.add("open");
}

function closeSignIn() {
  authOverlay.classList.remove("open");
}

async function goToAccount() {
  if (!currentUser) {
    openSignIn();
    return;
  }

  try {
    await syncStickerAccount(currentUser);
    location.href = ACCOUNT_URL;
  } catch (error) {
    console.error(error);
    openSignIn();
    authStatus.textContent =
      "Account sync failed: " + error.message;
  }
}

authButton.onclick = async () => {
  authButton.disabled = true;
  authStatus.textContent = "";

  try {
    const { error } = await client.auth.signInWithOAuth({
      provider: "discord",
      options: {
        redirectTo: ACCOUNT_URL,
        scopes: "identify"
      }
    });

    if (error) throw error;
  } catch (error) {
    authStatus.textContent = error.message;
  } finally {
    authButton.disabled = false;
  }
};

signinButton.onclick = goToAccount;

document.getElementById("pay-button").onclick = () => {
  window.StickerPurchase.open();
};

async function restoreSession() {
  const { data, error } = await client.auth.getUser();

  if (error) {
    console.error(error);
    return;
  }

  currentUser = data.user || null;
  updateAccountButton();
}

client.auth.onAuthStateChange((event, session) => {
  currentUser = session?.user || null;
  updateAccountButton();

  if (event === "SIGNED_IN" && currentUser) {
    const user = currentUser;

    setTimeout(() => {
      syncStickerAccount(user).catch(console.error);
    }, 0);
  }
});

restoreSession();

document.getElementById("auth-close").onclick =
  closeSignIn;

authOverlay.onclick = event => {
  if (event.target === authOverlay) closeSignIn();
};

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeSignIn();
});
</script>

<script src="purchase.js"></script>
</body>
</html>
