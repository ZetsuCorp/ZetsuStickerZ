
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticker Mania</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  background: #090515;
  color: white;
  font-family: Arial, sans-serif;
}

/* ARCADE */

.arcade-viewport {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  background: radial-gradient(
    ellipse at center,
    #24113f 0%,
    #10071f 55%,
    #05030c 100%
  );
}

.arcade-container {
  position: relative;
  width: min(100%, 900px, calc(100dvh - 24px));
  aspect-ratio: 1 / 1;
  border: 2px solid #543184;
  border-radius: 18px;
  background: #080412;
  overflow: hidden;
}

.game-container {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
}

.machine {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.dispenser-container {
  position: absolute;
  left: 30.5%;
  top: 83.5%;
  width: 34%;
  height: 10.5%;
  pointer-events: none;
}

/* ARCADE BUTTONS */

.hotspot {
  position: absolute;
  z-index: 2;
  border: 0;
  padding: 0;
  background: transparent;
  cursor: pointer;
  color: transparent;
  font-size: 0;
}

.hotspot:focus-visible,
.purchase-hotspot:focus-visible {
  outline: 3px solid white;
}

.pay-button {
  left: 77.5%;
  top: 27.5%;
  width: 14.3%;
  height: 23.4%;
}

.signin-button {
  left: 78.4%;
  top: 50.4%;
  width: 13%;
  height: 13.4%;
  overflow: hidden;
}

/* COLLECTION BUTTON */

.collection-button {
  display: none;
  width: 100%;
  height: 100%;
  background: #090c32;
  border: 2px solid #527cff;
  border-radius: 10px;
  box-shadow: 0 0 10px #315dff;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 5px;
  padding: 5px;
}

.signin-button.signed-in .collection-button {
  display: flex;
}

.collection-avatar {
  width: 48%;
  aspect-ratio: 1;
  border-radius: 50%;
  object-fit: cover;
  background: #29235d;
}

.collection-label {
  color: white;
  font-size: clamp(6px, 1.3vw, 10px);
  font-weight: bold;
  text-align: center;
  text-shadow: 0 0 5px #527cff;
}

/* DISCORD LOGIN MODAL */

.auth-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(5, 2, 11, 0.91);
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.auth-overlay.open {
  display: flex;
}

.auth-panel {
  position: relative;
  width: min(420px, 95vw);
  background: #211035;
  border: 2px solid #bd3aff;
  border-radius: 18px;
  padding: 32px;
  text-align: center;
  box-shadow: 0 0 30px #8c24d455;
}

.auth-close {
  position: absolute;
  top: 10px;
  right: 15px;
  border: 0;
  background: none;
  color: white;
  font-size: 28px;
  cursor: pointer;
}

.auth-action {
  background: #d837f2;
  border: 0;
  color: white;
  padding: 12px 22px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
}

.auth-action:disabled {
  opacity: 0.5;
}

#auth-status {
  font-size: 13px;
  overflow-wrap: anywhere;
}

/* PURCHASE MODAL */

.purchase-overlay {
  position: fixed;
  inset: 0;
  z-index: 15;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  background: rgba(5, 2, 11, 0.85);
}

.purchase-overlay[hidden] {
  display: none;
}

.purchase-modal {
  position: relative;
  width: min(94vw, 760px, 132dvh);
  max-height: 88dvh;
  border: 2px solid #bd3aff;
  border-radius: 14px;
  background: #080412;
  overflow: hidden;
  box-shadow: 0 0 35px #9b28e888;
}

.purchase-art {
  display: block;
  width: 100%;
  height: auto;
}

/* PURCHASE HOTSPOTS */

.purchase-hotspot {
  position: absolute;
  z-index: 2;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
}

.purchase-common {
  left: 13%;
  top: 65%;
  width: 21%;
  height: 11%;
}

.purchase-rare {
  left: 40%;
  top: 65%;
  width: 20%;
  height: 11%;
}

.purchase-legendary {
  left: 67%;
  top: 65%;
  width: 20%;
  height: 11%;
}

.purchase-close {
  right: 8.3%;
  top: 8.5%;
  width: 5%;
  height: 7%;
}

.purchase-status {
  position: absolute;
  left: 12%;
  bottom: 2%;
  width: 76%;
  margin: 0;
  color: white;
  font-size: clamp(9px, 1.4vw, 13px);
  text-align: center;
  text-shadow: 0 0 8px #bd3aff;
  pointer-events: none;
}

/* SOLANA PAY PANEL */

.payment-details {
  position: absolute;
  z-index: 4;
  left: 9%;
  right: 9%;
  top: 15%;
  padding: 15px;
  border: 2px solid #bd3aff;
  border-radius: 12px;
  background: rgba(10, 5, 26, 0.97);
  color: white;
  text-align: center;
  box-shadow: 0 0 24px #9b28e888;
  font-size: clamp(11px, 1.8vw, 15px);
}

.payment-details[hidden] {
  display: none;
}

.payment-details p {
  overflow-wrap: anywhere;
}

.payment-details a,
.payment-details button {
  display: inline-block;
  margin: 5px;
  padding: 9px 12px;
  background: #b82be8;
  color: white;
  border: 0;
  border-radius: 7px;
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
}

.payment-details .secondary-action {
  background: #292044;
}

.payment-details button:disabled {
  opacity: 0.5;
}

/* MOBILE */

@media (max-width: 600px) {
  .arcade-viewport {
    padding: 4px;
  }

  .arcade-container {
    width: min(100%, calc(100dvh - 8px));
    border-radius: 8px;
    border-width: 1px;
  }

  .collection-button {
    border-radius: 5px;
    border-width: 1px;
    gap: 2px;
    padding: 2px;
  }

  .collection-label {
    font-size: clamp(5px, 1.8vw, 9px);
  }

  .auth-panel {
    padding: 25px 18px;
  }

  .purchase-overlay {
    padding: 5px;
  }

  .purchase-modal {
    width: min(98vw, 132dvh);
    border-width: 1px;
    border-radius: 7px;
  }

  .purchase-status {
    font-size: 8px;
  }

  .payment-details {
    padding: 8px;
    top: 12%;
    font-size: 10px;
  }

  .payment-details a,
  .payment-details button {
    padding: 6px;
    margin: 3px;
    font-size: 10px;
  }
}
</style>
</head>

<body>

<!-- ARCADE -->

<main class="arcade-viewport">
  <div class="arcade-container">
    <div class="game-container" id="game-container">

      <img
        class="machine"
        src="assets/ZetsuStickerZ.png"
        alt="Sticker Mania Machine"
      >

      <div
        class="dispenser-container"
        id="dispenser-container">
      </div>

      <button
        class="hotspot pay-button"
        id="pay-button"
        aria-label="Buy a capsule">
      </button>

      <button
        class="hotspot signin-button"
        id="signin-button"
        aria-label="Sign in with Discord">

        <span class="collection-button">
          <img
            class="collection-avatar"
            id="collection-avatar"
            alt="Discord Profile"
          >

          <span class="collection-label">
            MY COLLECTION
          </span>
        </span>

      </button>

    </div>
  </div>
</main>

<!-- PURCHASE MODAL -->

<div
  class="purchase-overlay"
  id="purchase-overlay"
  hidden
>
  <div
    class="purchase-modal"
    role="dialog"
    aria-modal="true"
    aria-label="Sticker Mania Capsule Purchase"
  >

    <img
      class="purchase-art"
      src="assets/zcety.png"
      alt="Sticker Mania Capsule Options"
    >

    <button
      class="purchase-hotspot purchase-common"
      data-tier="common"
      aria-label="Buy Common capsule for $0.50">
    </button>

    <button
      class="purchase-hotspot purchase-rare"
      data-tier="rare"
      aria-label="Buy Rare capsule for $1.00">
    </button>

    <button
      class="purchase-hotspot purchase-legendary"
      data-tier="legendary"
      aria-label="Buy Legendary capsule for $3.00">
    </button>

    <button
      class="purchase-hotspot purchase-close"
      id="purchase-close"
      aria-label="Close purchase">
    </button>

    <!-- SOLANA PAY -->

    <div
      class="payment-details"
      id="payment-details"
      hidden
    >
      <strong id="payment-title">
        SOLANA PAY
      </strong>

      <p id="payment-amount"></p>

      <p
        id="payment-message"
        role="status">
      </p>

      <a
        id="payment-link"
        href="#">
        OPEN SOLANA WALLET
      </a>

      <button
        id="payment-copy"
        type="button">
        COPY PAYMENT LINK
      </button>

      <button
        id="payment-check"
        type="button">
        CHECK PAYMENT
      </button>

      <button
        id="payment-back"
        class="secondary-action"
        type="button">
        BACK
      </button>
    </div>

    <p
      class="purchase-status"
      id="purchase-status"
      role="status">
    </p>

  </div>
</div>

<!-- DISCORD LOGIN MODAL -->

<div class="auth-overlay" id="auth-overlay">
  <div class="auth-panel">

    <button
      class="auth-close"
      id="auth-close"
      aria-label="Close">
      ×
    </button>

    <h2>SIGN IN</h2>

    <p>
      Sign in with Discord to access your
      Sticker Mania account.
    </p>

    <button
      class="auth-action"
      id="discord-auth">
      Continue with Discord
    </button>

    <p
      id="auth-status"
      role="status">
    </p>

  </div>
</div>

<script>
/* SUPABASE */

const SUPABASE_URL =
  "https://jqvnrdjrkdjgjbmqmbbl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_jmEahTk4OssD_IrOZq_6iQ_P6QFFJr6";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const ACCOUNT_URL =
  new URL("account.html", window.location.href).href;

const PENDING_KEY =
  "sticker_mania_pending";

let currentUser = null;
let activePurchase = null;
let paymentTimer = null;
let checkingPayment = false;

/* ELEMENTS */

const authOverlay =
  document.getElementById("auth-overlay");

const authButton =
  document.getElementById("discord-auth");

const authStatus =
  document.getElementById("auth-status");

const signinButton =
  document.getElementById("signin-button");

const collectionAvatar =
  document.getElementById("collection-avatar");

const purchaseOverlay =
  document.getElementById("purchase-overlay");

const purchaseStatus =
  document.getElementById("purchase-status");

const purchaseClose =
  document.getElementById("purchase-close");

const payButton =
  document.getElementById("pay-button");

const paymentDetails =
  document.getElementById("payment-details");

const paymentTitle =
  document.getElementById("payment-title");

const paymentAmount =
  document.getElementById("payment-amount");

const paymentMessage =
  document.getElementById("payment-message");

const paymentLink =
  document.getElementById("payment-link");

const paymentCopy =
  document.getElementById("payment-copy");

const paymentCheck =
  document.getElementById("payment-check");

const paymentBack =
  document.getElementById("payment-back");

const tierButtons =
  document.querySelectorAll("[data-tier]");

/* DISCORD ACCOUNT */

function getDiscordUsername(user) {
  return (
    user?.user_metadata?.custom_claims?.global_name ||
    user?.user_metadata?.global_name ||
    user?.user_metadata?.preferred_username ||
    user?.user_metadata?.user_name ||
    user?.user_metadata?.full_name ||
    user?.user_metadata?.name ||
    user?.email ||
    "Discord user"
  );
}

function getDiscordId(user) {
  const identity = user?.identities?.find(
    item => item.provider === "discord"
  );

  return (
    identity?.id ||
    identity?.identity_data?.provider_id ||
    user?.user_metadata?.provider_id ||
    user?.user_metadata?.sub ||
    null
  );
}

function updateAccountButton() {
  const signedIn = !!currentUser;

  signinButton.classList.toggle(
    "signed-in",
    signedIn
  );

  signinButton.setAttribute(
    "aria-label",
    signedIn
      ? "View My Collection"
      : "Sign in with Discord"
  );

  const avatar =
    currentUser?.user_metadata?.avatar_url;

  if (signedIn && avatar) {
    collectionAvatar.src = avatar;
    collectionAvatar.style.display = "block";
  } else {
    collectionAvatar.removeAttribute("src");
    collectionAvatar.style.display = "none";
  }
}

async function syncStickerAccount(user) {
  if (!user) return;

  const { error } = await client
    .from("sticker_accounts")
    .upsert({
      id: user.id,
      discord_id: getDiscordId(user),
      username: getDiscordUsername(user),
      updated_at: new Date().toISOString()
    }, {
      onConflict: "id"
    });

  if (error) throw error;
}

function openSignIn() {
  authStatus.textContent = "";
  authOverlay.classList.add("open");
}

function closeSignIn() {
  authOverlay.classList.remove("open");
}

async function goToAccount() {
  if (!currentUser) {
    openSignIn();
    return;
  }

  try {
    await syncStickerAccount(currentUser);
    window.location.href = ACCOUNT_URL;
  } catch (error) {
    console.error(error);
    openSignIn();
    authStatus.textContent =
      "Account sync failed: " + error.message;
  }
}

authButton.onclick = async () => {
  authButton.disabled = true;
  authStatus.textContent = "";

  try {
    const { error } =
      await client.auth.signInWithOAuth({
        provider: "discord",
        options: {
          redirectTo: ACCOUNT_URL,
          scopes: "identify"
        }
      });

    if (error) throw error;
  } catch (error) {
    authStatus.textContent = error.message;
  } finally {
    authButton.disabled = false;
  }
};

signinButton.onclick = goToAccount;

async function restoreSession() {
  const { data, error } =
    await client.auth.getUser();

  if (error) {
    console.error(error);
    return;
  }

  currentUser = data.user || null;
  updateAccountButton();
}

client.auth.onAuthStateChange((event, session) => {
  currentUser = session?.user || null;
  updateAccountButton();

  if (event === "SIGNED_IN" && currentUser) {
    const user = currentUser;

    setTimeout(() => {
      syncStickerAccount(user).catch(console.error);
    }, 0);
  }
});

restoreSession();

document.getElementById("auth-close").onclick =
  closeSignIn;

authOverlay.onclick = event => {
  if (event.target === authOverlay) {
    closeSignIn();
  }
};

/* PURCHASE MODAL */

function openPurchase() {
  purchaseStatus.textContent = "";
  purchaseOverlay.hidden = false;

  const pending = loadPendingPurchase();

  if (
    pending?.purchaseId &&
    pending?.paymentUrl
  ) {
    showPayment(pending);
    void verifyPayment(false);
  } else {
    paymentDetails.hidden = true;
  }

  purchaseClose.focus();
}

function closePurchase() {
  stopPaymentPolling();
  purchaseOverlay.hidden = true;
  purchaseStatus.textContent = "";
  payButton.focus();
}

payButton.addEventListener(
  "click",
  openPurchase
);

purchaseClose.addEventListener(
  "click",
  closePurchase
);

purchaseOverlay.addEventListener(
  "click",
  event => {
    if (event.target === purchaseOverlay) {
      closePurchase();
    }
  }
);

/* PENDING PURCHASE STORAGE */

function savePendingPurchase(purchase) {
  sessionStorage.setItem(
    PENDING_KEY,
    JSON.stringify(purchase)
  );
}

function loadPendingPurchase() {
  try {
    const stored =
      sessionStorage.getItem(PENDING_KEY);

    return stored
      ? JSON.parse(stored)
      : null;
  } catch {
    return null;
  }
}

function clearPendingPurchase() {
  sessionStorage.removeItem(PENDING_KEY);
}

/* PAYMENT POLLING */

function stopPaymentPolling() {
  if (paymentTimer !== null) {
    clearInterval(paymentTimer);
    paymentTimer = null;
  }
}

function startPaymentPolling() {
  stopPaymentPolling();

  paymentTimer = setInterval(() => {
    void verifyPayment(false);
  }, 6000);
}

function resetPaymentPanel() {
  stopPaymentPolling();
  paymentDetails.hidden = true;
  activePurchase = null;
  paymentMessage.textContent = "";
}

/* DISPLAY SOLANA PAY */

function showPayment(purchase) {
  activePurchase = purchase;

  paymentTitle.textContent =
    purchase.tier.toUpperCase() + " CAPSULE";

  paymentAmount.textContent =
    "$" +
    Number(purchase.priceUsd).toFixed(2) +
    " USD = " +
    purchase.awtAmount +
    " AWT";

  paymentMessage.textContent =
    "Complete payment in your Solana wallet.";

  paymentLink.href = purchase.paymentUrl;

  paymentLink.style.display = "inline-block";
  paymentCopy.style.display = "inline-block";
  paymentCheck.style.display = "inline-block";

  paymentDetails.hidden = false;

  startPaymentPolling();
}

/* VERIFY PAYMENT AND RECEIVE CAPSULE */

async function verifyPayment(manual = true) {
  if (
    !activePurchase ||
    checkingPayment ||
    !currentUser
  ) {
    return;
  }

  checkingPayment = true;

  const purchaseId = activePurchase.purchaseId;

  if (manual) {
    paymentMessage.textContent =
      "Checking Solana payment...";
  }

  try {
    const { data, error } =
      await client.functions.invoke(
        "verify-capsule",
        {
          body: { purchaseId }
        }
      );

    if (error) throw error;

    // Ignore an old request if the player
    // has moved to a different purchase.
    if (
      !activePurchase ||
      activePurchase.purchaseId !== purchaseId
    ) {
      return;
    }

    if (data?.status === "fulfilled") {
      stopPaymentPolling();
      clearPendingPurchase();

      const capsule = data.capsule;

      if (capsule) {
        paymentTitle.textContent =
          "CAPSULE #" + capsule.id;

        paymentMessage.textContent =
          "YOU RECEIVED: " +
          capsule.reward_name +
          " (" +
          capsule.reward_type.toUpperCase() +
          ")";
      } else {
        paymentMessage.textContent =
          "Payment verified. Capsule drawn!";
      }

      paymentLink.style.display = "none";
      paymentCopy.style.display = "none";
      paymentCheck.style.display = "none";

      return;
    }

    if (data?.status === "pending") {
      const expired =
        activePurchase.expiresAt &&
        Date.now() >
        new Date(activePurchase.expiresAt).getTime();

      if (expired) {
        stopPaymentPolling();

        paymentMessage.textContent =
          "Payment window expired. " +
          "Check payment status before starting another purchase.";
      } else {
        paymentMessage.textContent =
          "Waiting for confirmed AWT payment...";
      }

      return;
    }

    paymentMessage.textContent =
      data?.message ||
      "Payment status unavailable.";

  } catch (error) {
    console.error(error);

    paymentMessage.textContent =
      "Verification unavailable: " +
      error.message;

  } finally {
    checkingPayment = false;
  }
}

/* PAYMENT BUTTONS */

paymentCopy.addEventListener(
  "click",
  async () => {
    if (!activePurchase) return;

    try {
      await navigator.clipboard.writeText(
        activePurchase.paymentUrl
      );

      paymentMessage.textContent =
        "Solana Pay link copied.";

    } catch {
      paymentMessage.textContent =
        "Could not copy payment link.";
    }
  }
);

paymentCheck.addEventListener(
  "click",
  () => {
    void verifyPayment(true);
  }
);

paymentBack.addEventListener(
  "click",
  () => {
    resetPaymentPanel();
    // Preserve the pending payment so it
    // can still be checked on return.
  }
);

/* PURCHASE CAPSULE */

tierButtons.forEach(button => {
  button.addEventListener(
    "click",
    async () => {
      const tier = button.dataset.tier;

      if (!currentUser) {
        closePurchase();
        openSignIn();
        return;
      }

      // Prevent accidentally replacing an
      // existing pending payment request.
      const pending = loadPendingPurchase();

      if (
        pending?.purchaseId &&
        pending?.paymentUrl
      ) {
        showPayment(pending);
        void verifyPayment(false);
        return;
      }

      purchaseStatus.textContent =
        "Preparing " +
        tier.toUpperCase() +
        " capsule...";

      tierButtons.forEach(
        b => b.disabled = true
      );

      try {
        const { data, error } =
          await client.functions.invoke(
            "purchase-capsule",
            {
              body: { tier }
            }
          );

        if (error) throw error;

        if (
          !data?.purchaseId ||
          !data?.paymentUrl ||
          !data?.awtAmount
        ) {
          throw new Error(
            "Solana Pay instructions were not returned."
          );
        }

        savePendingPurchase(data);
        showPayment(data);

        purchaseStatus.textContent = "";

      } catch (error) {
        console.error(error);

        purchaseStatus.textContent =
          "Purchase unavailable: " +
          error.message;

      } finally {
        tierButtons.forEach(
          b => b.disabled = false
        );
      }
    }
  );
});

/* ESCAPE KEY */

document.addEventListener(
  "keydown",
  event => {
    if (event.key !== "Escape") return;

    if (!purchaseOverlay.hidden) {
      closePurchase();
    } else {
      closeSignIn();
    }
  }
);
</script>

</body>
</html>
