<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticker Mania</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100dvh;
  font-family: Arial, sans-serif;
  background: #090515;
  color: white;
}

/* VENDING MACHINE */

.arcade-viewport {
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 12px;
  background: radial-gradient(
    ellipse at center,
    #24113f,
    #10071f 55%,
    #05030c
  );
}

.arcade-container {
  position: relative;
  width: min(100%, 900px, calc(100dvh - 24px));
  aspect-ratio: 1 / 1;
  border: 2px solid #543184;
  border-radius: 18px;
  overflow: hidden;
  background: #080412;
}

.game-container {
  position: relative;
  width: 100%;
  height: 100%;
}

.machine {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.dispenser-container {
  position: absolute;
  left: 30.5%;
  top: 83.5%;
  width: 34%;
  height: 10.5%;
  pointer-events: none;
}

/* SOL PRICE LABELS */

.sol-price-tag,
.purchase-price-tag {
  position: absolute;
  z-index: 3;
  padding: 3px 6px;
  border: 1px solid #943bce;
  border-radius: 4px;
  background: rgba(9, 5, 26, 0.87);
  color: #64ffcb;
  font-size: 11px;
  font-weight: bold;
  line-height: 1.2;
  white-space: nowrap;
  pointer-events: none;
}

.sol-price-tag {
  top: 8px;
  right: 8px;
}

.purchase-price-tag {
  top: 8px;
  left: 8px;
}

/* CLICKABLE AREAS */

.hotspot {
  position: absolute;
  z-index: 2;
  border: none;
  padding: 0;
  background: transparent;
  cursor: pointer;
}

.hotspot:focus-visible,
.purchase-hotspot:focus-visible {
  outline: 2px solid white;
}

.pay-button {
  left: 77.5%;
  top: 27.5%;
  width: 14.3%;
  height: 23.4%;
}

.signin-button {
  left: 78.4%;
  top: 50.4%;
  width: 13%;
  height: 13.4%;
  overflow: hidden;
}

/* COLLECTION */

.collection-button {
  display: none;
  width: 100%;
  height: 100%;
  background: #090c32;
  border: 2px solid #527cff;
  border-radius: 10px;
  box-shadow: 0 0 10px #315dff;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 5px;
}

.signin-button.signed-in .collection-button {
  display: flex;
}

.collection-avatar {
  width: 48%;
  aspect-ratio: 1;
  border-radius: 50%;
  object-fit: cover;
  background: #29235d;
}

.collection-label {
  color: white;
  font-weight: bold;
  font-size: clamp(6px, 1.3vw, 10px);
  text-shadow: 0 0 5px #527cff;
}

/* OVERLAYS */

.auth-overlay,
.purchase-overlay {
  position: fixed;
  inset: 0;
  align-items: center;
  justify-content: center;
  padding: 12px;
}

.auth-overlay {
  display: none;
  z-index: 20;
  background: rgba(5, 2, 11, 0.92);
}

.auth-overlay.open {
  display: flex;
}

.auth-panel {
  position: relative;
  width: min(420px, 95vw);
  padding: 30px;
  border: 2px solid #bd3aff;
  border-radius: 18px;
  background: #211035;
  text-align: center;
}

.auth-close {
  position: absolute;
  top: 8px;
  right: 14px;
  background: none;
  border: 0;
  color: white;
  font-size: 28px;
  cursor: pointer;
}

.auth-action {
  border: 0;
  border-radius: 10px;
  background: #d837f2;
  padding: 12px 22px;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.auth-action:disabled {
  opacity: 0.5;
}

#auth-status {
  font-size: 13px;
  overflow-wrap: anywhere;
}

/* CAPSULE MENU */

.purchase-overlay {
  display: flex;
  z-index: 15;
  background: rgba(5, 2, 11, 0.86);
}

.purchase-overlay[hidden],
.payment-panel[hidden] {
  display: none;
}

.purchase-modal {
  position: relative;
  width: min(94vw, 760px, 132dvh);
  max-height: 88dvh;
  border: 2px solid #bd3aff;
  border-radius: 14px;
  background: #080412;
  overflow: hidden;
  box-shadow: 0 0 35px #9b28e888;
}

.purchase-art {
  display: block;
  width: 100%;
  height: auto;
}

.purchase-hotspot {
  position: absolute;
  z-index: 2;
  border: 0;
  background: transparent;
  cursor: pointer;
}

.purchase-hotspot:disabled {
  cursor: wait;
}

.purchase-common {
  left: 13%;
  top: 65%;
  width: 21%;
  height: 11%;
}

.purchase-rare {
  left: 40%;
  top: 65%;
  width: 20%;
  height: 11%;
}

.purchase-legendary {
  left: 67%;
  top: 65%;
  width: 20%;
  height: 11%;
}

.purchase-close {
  right: 8.3%;
  top: 8.5%;
  width: 5%;
  height: 7%;
}

.purchase-status {
  position: absolute;
  left: 10%;
  bottom: 2%;
  width: 80%;
  margin: 0;
  color: white;
  font-size: clamp(9px, 1.4vw, 13px);
  text-align: center;
  text-shadow: 0 0 7px #bd3aff;
  overflow-wrap: anywhere;
  pointer-events: none;
}

/* SOLANA PAY PANEL */

.payment-panel {
  position: absolute;
  z-index: 5;
  inset: 4%;
  border: 2px solid #bd3aff;
  border-radius: 12px;
  padding: 12px;
  overflow-y: auto;
  background: rgba(9, 5, 22, 0.98);
  box-shadow: 0 0 25px #bd3aff77;
  text-align: center;
}

.payment-panel h2 {
  font-size: clamp(16px, 2.4vw, 23px);
  margin: 6px 0;
}

.payment-panel p {
  font-size: clamp(11px, 1.6vw, 14px);
  overflow-wrap: anywhere;
}

.payment-amount {
  font-size: clamp(16px, 3vw, 24px);
  font-weight: bold;
  color: #f6d2ff;
  overflow-wrap: anywhere;
}

#payment-qr {
  display: block;
  width: min(42%, 180px);
  height: auto;
  margin: 10px auto;
  padding: 7px;
  background: white;
  border-radius: 8px;
}

.payment-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
}

.payment-actions button,
.payment-actions a {
  display: inline-block;
  padding: 9px 12px;
  border: 0;
  border-radius: 7px;
  background: #ae2bdd;
  color: white;
  font-size: 12px;
  font-weight: bold;
  text-decoration: none;
  cursor: pointer;
}

.payment-actions .secondary {
  background: #383050;
}

#payment-message {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.payment-error {
  color: #ff9f9f;
}

/* MOBILE */

@media (max-width: 600px) {
  .arcade-viewport {
    padding: 4px;
  }

  .arcade-container {
    width: min(100%, calc(100dvh - 8px));
    border-width: 1px;
    border-radius: 8px;
  }

  .sol-price-tag,
  .purchase-price-tag {
    top: 4px;
    padding: 2px 4px;
    font-size: 8px;
  }

  .sol-price-tag {
    right: 4px;
  }

  .purchase-price-tag {
    left: 4px;
  }

  .collection-button {
    gap: 2px;
    padding: 2px;
    border-radius: 5px;
  }

  .collection-label {
    font-size: 6px;
  }

  .purchase-overlay {
    padding: 5px;
  }

  .purchase-modal {
    width: min(98vw, 132dvh);
    border-radius: 7px;
    border-width: 1px;
  }

  .purchase-status {
    font-size: 8px;
  }

  .payment-panel {
    padding: 7px;
  }

  #payment-qr {
    width: min(35%, 130px);
    margin: 5px auto;
  }

  .payment-actions button,
  .payment-actions a {
    font-size: 10px;
    padding: 6px;
  }
}
</style>
</head>

<body>

<!-- VENDING MACHINE -->

<main class="arcade-viewport">
  <div class="arcade-container">
    <div class="game-container" id="game-container">

      <img
        class="machine"
        src="assets/ZetsuStickerZ.png"
        alt="Sticker Mania Vending Machine"
      >

      <span
        class="sol-price-tag"
        id="sol-price-main"
        title="Current SOL price in USD">SOL LOADING...</span>

      <div
        class="dispenser-container"
        id="dispenser-container">
      </div>

      <button
        class="hotspot pay-button"
        id="pay-button"
        aria-label="Buy capsules">
      </button>

      <button
        class="hotspot signin-button"
        id="signin-button"
        aria-label="Discord login or collection">

        <span class="collection-button">
          <img
            class="collection-avatar"
            id="collection-avatar"
            alt="Profile"
          >

          <span class="collection-label">
            MY COLLECTION
          </span>
        </span>

      </button>

    </div>
  </div>
</main>

<!-- CAPSULE PURCHASE MENU -->

<div
  class="purchase-overlay"
  id="purchase-overlay"
  hidden>

  <div
    class="purchase-modal"
    role="dialog"
    aria-modal="true"
    aria-label="Capsule purchase">

    <img
      class="purchase-art"
      src="assets/zcety.png"
      alt="Select your capsule"
    >

    <span
      class="purchase-price-tag"
      id="sol-price-purchase"
      title="Current SOL price in USD">SOL LOADING...</span>

    <button
      class="purchase-hotspot purchase-common"
      data-tier="common"
      aria-label="Common Capsule $0.50">
    </button>

    <button
      class="purchase-hotspot purchase-rare"
      data-tier="rare"
      aria-label="Rare Capsule $1">
    </button>

    <button
      class="purchase-hotspot purchase-legendary"
      data-tier="legendary"
      aria-label="Legendary Capsule $3">
    </button>

    <button
      class="purchase-hotspot purchase-close"
      id="purchase-close"
      aria-label="Close">
    </button>

    <p
      class="purchase-status"
      id="purchase-status"
      role="status">
    </p>

    <!-- SOLANA PAY -->

    <section
      class="payment-panel"
      id="payment-panel"
      hidden>

      <h2 id="payment-title">SOLANA PAY</h2>

      <p id="payment-usd"></p>

      <div
        class="payment-amount"
        id="payment-sol">
      </div>

      <canvas id="payment-qr"></canvas>

      <p id="payment-message" role="status"></p>

      <div class="payment-actions">

        <a id="payment-wallet" href="#">
          OPEN WALLET
        </a>

        <button
          id="payment-copy"
          type="button">
          COPY LINK
        </button>

        <button
          id="payment-check"
          type="button">
          CHECK PAYMENT
        </button>

        <button
          id="payment-back"
          class="secondary"
          type="button">
          BACK
        </button>

      </div>

    </section>

  </div>
</div>

<!-- DISCORD SIGN IN -->

<div class="auth-overlay" id="auth-overlay">
  <div class="auth-panel">

    <button
      class="auth-close"
      id="auth-close"
      aria-label="Close">
      ×
    </button>

    <h2>SIGN IN</h2>

    <p>
      Sign in with Discord to access
      your Sticker Mania account.
    </p>

    <button
      class="auth-action"
      id="discord-auth">
      Continue with Discord
    </button>

    <p id="auth-status" role="status"></p>

  </div>
</div>

<script>

/* CONFIGURATION */

const SUPABASE_URL =
  "https://jqvnrdjrkdjgjbmqmbbl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_jmEahTk4OssD_IrOZq_6iQ_P6QFFJr6";

const RECEIVER =
  "CT1fjjJMaNb2jgwH7rnuyiLcASmtmdRzSw7tQv8VXaRK";

const CAPSULE_PRICES = {
  common: 0.50,
  rare: 1.00,
  legendary: 3.00
};

const ACCOUNT_URL =
  new URL("account.html", window.location.href).href;

const PRICE_REFRESH_MS = 60000;
const PAYMENT_CHECK_MS = 6000;

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);

/* STATE */

let currentUser = null;
let activePurchase = null;

let paymentTimer = null;
let purchasing = false;
let checkingPayment = false;

/* ELEMENTS */

const priceMain = $("sol-price-main");
const pricePurchase = $("sol-price-purchase");

const payButton = $("pay-button");
const signinButton = $("signin-button");

const collectionAvatar = $("collection-avatar");

const purchaseOverlay = $("purchase-overlay");
const purchaseClose = $("purchase-close");
const purchaseStatus = $("purchase-status");

const paymentPanel = $("payment-panel");
const paymentTitle = $("payment-title");
const paymentUsd = $("payment-usd");
const paymentSol = $("payment-sol");
const paymentMessage = $("payment-message");
const paymentQr = $("payment-qr");

const paymentWallet = $("payment-wallet");
const paymentCopy = $("payment-copy");
const paymentCheck = $("payment-check");
const paymentBack = $("payment-back");

const authOverlay = $("auth-overlay");
const authButton = $("discord-auth");
const authStatus = $("auth-status");

const tierButtons = [
  ...document.querySelectorAll("[data-tier]")
];

/* FUNCTION ERROR DETAILS */

async function functionError(error) {
  let message = error?.message || "Unknown error";

  if (error?.context instanceof Response) {
    const response = error.context;

    try {
      const text = await response.clone().text();

      try {
        const json = JSON.parse(text);

        message =
          json.error ||
          json.message ||
          JSON.stringify(json);

      } catch {
        message = text || message;
      }

    } catch {}

    return `HTTP ${response.status}: ${message}`;
  }

  return message;
}

/* LIVE SOL/USD PRICE: PUBLIC MARKET DATA, NO SUPABASE FUNCTION */

let lastSOLPrice = null;

function formatPrice(price) {
  return "$" + Number(price).toFixed(2);
}

async function refreshSOLPrice() {
  const feeds = [
    {
      url: "https://api.coinbase.com/v2/prices/SOL-USD/spot",
      get: json => json?.data?.amount
    },
    {
      url: "https://api.kraken.com/0/public/Ticker?pair=SOLUSD",
      get: json => Object.values(json?.result || {})[0]?.c?.[0]
    },
    {
      url: "https://api.coingecko.com/api/v3/simple/price?ids=solana&vs_currencies=usd",
      get: json => json?.solana?.usd
    }
  ];

  for (const feed of feeds) {
    try {
      const response = await fetch(feed.url, {
        method: "GET",
        cache: "no-store",
        credentials: "omit",
        signal: AbortSignal.timeout(6000)
      });
      if (!response.ok) continue;

      const price = Number(feed.get(await response.json()));
      if (!Number.isFinite(price) || price <= 0) continue;

      lastSOLPrice = price;
      const label = "SOL " + formatPrice(price);
      priceMain.textContent = label;
      pricePurchase.textContent = label;
      return;
    } catch (error) {
      console.warn("[SOL PRICE] Market feed unavailable:", feed.url, error);
    }
  }

  // Preserve the last valid quote if all price feeds temporarily fail.
  const label = lastSOLPrice === null
    ? "SOL PRICE UNAVAILABLE"
    : "SOL " + formatPrice(lastSOLPrice) + " (LAST)";
  priceMain.textContent = label;
  pricePurchase.textContent = label;
}

function updateSOLPrice() {
  void refreshSOLPrice();
}

/* DISCORD USER INFORMATION */

function discordName(user) {
  return (
    user?.user_metadata?.global_name ||
    user?.user_metadata?.preferred_username ||
    user?.user_metadata?.user_name ||
    user?.user_metadata?.full_name ||
    user?.user_metadata?.name ||
    "Discord User"
  );
}

function discordId(user) {
  const identity = user?.identities?.find(
    identity => identity.provider === "discord"
  );

  return (
    identity?.id ||
    identity?.identity_data?.provider_id ||
    user?.user_metadata?.provider_id ||
    null
  );
}

/* LOGIN DISPLAY */

function updateLoginDisplay() {
  const signedIn = !!currentUser;

  signinButton.classList.toggle(
    "signed-in",
    signedIn
  );

  const avatar =
    currentUser?.user_metadata?.avatar_url;

  if (signedIn && avatar) {
    collectionAvatar.src = avatar;
    collectionAvatar.style.display = "block";
  } else {
    collectionAvatar.removeAttribute("src");
    collectionAvatar.style.display = "none";
  }
}

/* ACCOUNT SYNC */

async function syncAccount(user) {
  if (!user) return;

  const { error } = await client
    .from("sticker_accounts")
    .upsert(
      {
        id: user.id,
        discord_id: discordId(user),
        username: discordName(user),
        updated_at: new Date().toISOString()
      },
      {
        onConflict: "id"
      }
    );

  if (error) {
    console.error("[ACCOUNT SYNC]", error.message);
  }
}

/* DISCORD AUTHENTICATION */

function openAuth() {
  authStatus.textContent = "";
  authOverlay.classList.add("open");
}

function closeAuth() {
  authOverlay.classList.remove("open");
}

authButton.onclick = async () => {
  authButton.disabled = true;
  authStatus.textContent = "";

  try {
    const { error } =
      await client.auth.signInWithOAuth({
        provider: "discord",
        options: {
          redirectTo: ACCOUNT_URL,
          scopes: "identify"
        }
      });

    if (error) {
      throw error;
    }
  } catch (error) {
    authStatus.textContent = error.message;
  } finally {
    authButton.disabled = false;
  }
};

signinButton.onclick = () => {
  if (!currentUser) {
    openAuth();
    return;
  }

  window.location.href = ACCOUNT_URL;
};

$("auth-close").onclick = closeAuth;

authOverlay.onclick = event => {
  if (event.target === authOverlay) {
    closeAuth();
  }
};

client.auth.onAuthStateChange(
  (event, session) => {
    currentUser = session?.user || null;

    updateLoginDisplay();

    if (event === "SIGNED_IN" && currentUser) {
      const user = currentUser;

      setTimeout(() => {
        void syncAccount(user);
      }, 0);
    }
  }
);

async function restoreUser() {
  const { data, error } =
    await client.auth.getUser();

  if (error) {
    console.error("[SESSION]", error.message);
  }

  currentUser = data?.user || null;

  updateLoginDisplay();
}

void restoreUser();

/* AUTHENTICATED EDGE FUNCTIONS */

async function invoke(name, body) {
  const {
    data: sessionData,
    error: sessionError
  } = await client.auth.getSession();

  if (sessionError) {
    throw sessionError;
  }

  const token = sessionData.session?.access_token;

  if (!token) {
    throw new Error("Sign in with Discord");
  }

  const { data, error } =
    await client.functions.invoke(
      name,
      {
        method: "POST",
        body,
        headers: {
          Authorization: "Bearer " + token
        }
      }
    );

  if (error) {
    const detail = await functionError(error);
    if (error.name === "FunctionsFetchError" ||
        /Failed to send a request to the Edge Function/i.test(detail)) {
      throw new Error(
        "Payment server unavailable (" + name +
        "). Its Supabase Edge Function must be deployed."
      );
    }
    throw new Error(detail);
  }

  if (!data || data.error) {
    throw new Error(
      data?.error || "Invalid function response"
    );
  }

  return data;
}

/* PENDING TRANSACTION */

function pendingKey() {
  return (
    "sticker_mania_pending_" +
    (currentUser?.id || "anonymous")
  );
}

function savePending(purchase) {
  try {
    localStorage.setItem(
      pendingKey(),
      JSON.stringify(purchase)
    );
  } catch (error) {
    console.error("[PENDING PURCHASE]", error);
  }
}

function readPending() {
  try {
    const raw = localStorage.getItem(pendingKey());

    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}

function clearPending() {
  try {
    localStorage.removeItem(pendingKey());
  } catch {}
}

/* PURCHASE VALIDATION */

function validatePurchase(data, tier) {
  if (
    !data ||
    !data.purchaseId ||
    !data.reference ||
    !data.paymentUrl ||
    data.receiver !== RECEIVER
  ) {
    throw new Error("Incomplete purchase response");
  }

  if (
    Number(data.priceUsd) !==
    CAPSULE_PRICES[tier]
  ) {
    throw new Error("Incorrect capsule price");
  }

  const amount = Number(data.solAmount);

  if (
    !Number.isFinite(amount) ||
    amount <= 0
  ) {
    throw new Error("Invalid SOL payment amount");
  }

  const url = new URL(data.paymentUrl);

  if (
    url.protocol !== "solana:" ||
    url.pathname !== RECEIVER ||
    url.searchParams.has("spl-token") ||
    url.searchParams.get("reference") !== data.reference ||
    Number(url.searchParams.get("amount")) !== amount
  ) {
    throw new Error("Invalid Solana Pay payment request");
  }
}

/* PAYMENT DISPLAY */

function paymentStatus(message, error = false) {
  paymentMessage.textContent = message;

  paymentMessage.classList.toggle(
    "payment-error",
    error
  );
}

function stopPolling() {
  if (paymentTimer !== null) {
    clearInterval(paymentTimer);
    paymentTimer = null;
  }
}

function startPolling() {
  stopPolling();

  paymentTimer = setInterval(() => {
    if (
      activePurchase &&
      !purchaseOverlay.hidden &&
      !paymentPanel.hidden
    ) {
      void checkPayment();
    }
  }, PAYMENT_CHECK_MS);
}

async function showPayment(purchase) {
  activePurchase = purchase;

  paymentPanel.hidden = false;

  paymentTitle.textContent =
    purchase.tier.toUpperCase() + " CAPSULE";

  paymentUsd.textContent =
    "$" +
    Number(purchase.priceUsd).toFixed(2) +
    " USD";

  paymentSol.textContent =
    purchase.solAmount + " SOL";

  paymentWallet.href = purchase.paymentUrl;
  paymentWallet.hidden = false;

  paymentCopy.hidden = false;
  paymentCheck.hidden = false;
  paymentQr.hidden = false;

  paymentBack.textContent = "BACK";

  paymentStatus(
    "Scan with a Solana Pay wallet or open the payment link."
  );

  try {
    if (!window.QRCode) {
      throw new Error("QR code library unavailable");
    }

    await QRCode.toCanvas(
      paymentQr,
      purchase.paymentUrl,
      {
        width: 220,
        margin: 2
      }
    );
  } catch (error) {
    paymentQr.hidden = true;

    paymentStatus(
      "QR unavailable. Use OPEN WALLET or COPY LINK.",
      true
    );
  }

  startPolling();
}

/* VERIFY PAYMENT */

async function checkPayment() {
  if (!activePurchase || checkingPayment) {
    return;
  }

  checkingPayment = true;
  paymentCheck.disabled = true;

  const purchaseId = activePurchase.purchaseId;

  try {
    const result = await invoke(
      "verify-capsule",
      { purchaseId }
    );

    if (
      !activePurchase ||
      activePurchase.purchaseId !== purchaseId
    ) {
      return;
    }

    if (
      result.status === "paid" ||
      result.status === "fulfilled"
    ) {
      stopPolling();
      clearPending();

      const reward = result.capsule;

      paymentTitle.textContent = "CAPSULE OPENED";

      paymentSol.textContent =
        reward?.reward_name || "Reward selected";

      const rewardType = reward?.reward_type || "";

      let message =
        "REWARD: " +
        (reward?.reward_name || "Unknown") +
        "\nTYPE: " +
        rewardType.toUpperCase();

      if (
        rewardType === "nft" ||
        rewardType === "crypto"
      ) {
        message += "\nDelivery pending.";
      }

      paymentStatus(message);

      paymentWallet.hidden = true;
      paymentCopy.hidden = true;
      paymentCheck.hidden = true;
      paymentQr.hidden = true;

      paymentBack.textContent =
        "BACK TO CAPSULES";

      return;
    }

    if (result.status === "pending") {
      paymentStatus(
        result.message ||
        "Waiting for Solana payment confirmation..."
      );

      return;
    }

    paymentStatus(
      "Purchase status: " + result.status,
      true
    );

  } catch (error) {
    console.error("[VERIFY]", error);

    paymentStatus(
      "Verification error: " + error.message,
      true
    );

  } finally {
    checkingPayment = false;
    paymentCheck.disabled = false;
  }
}

/* CREATE PURCHASE */

async function buyCapsule(tier) {
  if (purchasing) {
    return;
  }

  if (
    !Object.prototype.hasOwnProperty.call(
      CAPSULE_PRICES,
      tier
    )
  ) {
    return;
  }

  if (!currentUser) {
    closePurchase();
    openAuth();
    return;
  }

  purchasing = true;

  tierButtons.forEach(button => {
    button.disabled = true;
  });

  purchaseStatus.textContent = "CREATING PURCHASE...";

  try {
    const result = await invoke(
      "purchase-capsule",
      { tier }
    );

    validatePurchase(result, tier);

    const purchase = {
      purchaseId: result.purchaseId,
      tier,
      priceUsd: result.priceUsd,
      solUsd: result.solUsd,
      solAmount: result.solAmount,
      paymentUrl: result.paymentUrl,
      reference: result.reference,
      expiresAt: result.expiresAt
    };

    savePending(purchase);

    purchaseStatus.textContent = "";

    await showPayment(purchase);

  } catch (error) {
    console.error("[PURCHASE]", error);

    purchaseStatus.textContent =
      "PURCHASE ERROR: " + error.message;

  } finally {
    purchasing = false;

    tierButtons.forEach(button => {
      button.disabled = false;
    });
  }
}

/* PURCHASE MENU */

function openPurchase() {
  purchaseOverlay.hidden = false;
  paymentPanel.hidden = true;

  purchaseStatus.textContent = "";

  stopPolling();
  activePurchase = null;

  updateSOLPrice();
}

function closePurchase() {
  stopPolling();

  purchaseOverlay.hidden = true;
  paymentPanel.hidden = true;

  purchaseStatus.textContent = "";

  payButton.focus();
}

payButton.onclick = openPurchase;

purchaseClose.onclick = closePurchase;

purchaseOverlay.onclick = event => {
  if (event.target === purchaseOverlay) {
    closePurchase();
  }
};

/* CAPSULE BUTTONS */

tierButtons.forEach(button => {
  button.onclick = () => {
    void buyCapsule(button.dataset.tier);
  };
});

/* WALLET */

paymentWallet.addEventListener("click", event => {
  if (!activePurchase) {
    event.preventDefault();
  }
});

/* COPY PAYMENT LINK */

paymentCopy.onclick = async () => {
  if (!activePurchase) {
    return;
  }

  try {
    await navigator.clipboard.writeText(
      activePurchase.paymentUrl
    );

    paymentStatus("Solana Pay link copied.");

  } catch (error) {
    paymentStatus(
      "Copy failed: " + error.message,
      true
    );
  }
};

/* MANUAL PAYMENT CHECK */

paymentCheck.onclick = () => {
  void checkPayment();
};

/* BACK TO CAPSULE SELECTION */

paymentBack.onclick = () => {
  stopPolling();

  paymentPanel.hidden = true;
  purchaseStatus.textContent = "";

  activePurchase = null;
};

/* ESCAPE KEY */

document.addEventListener("keydown", event => {
  if (event.key !== "Escape") {
    return;
  }

  if (!purchaseOverlay.hidden) {
    closePurchase();
  } else {
    closeAuth();
  }
});

/* START */

updateSOLPrice();

setInterval(
  updateSOLPrice,
  PRICE_REFRESH_MS
);

document.addEventListener(
  "visibilitychange",
  () => {
    if (!document.hidden) {
      updateSOLPrice();
    }
  }
);

</script>
</body>
</html>
