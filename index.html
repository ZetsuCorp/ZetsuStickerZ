<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticker Mania</title>

<script defer src="sticker-mania-boot.js?v=discord-checkout-1"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100dvh;
  font-family: Arial, sans-serif;
  background: #090515;
  color: white;
}

/* VENDING MACHINE */

.arcade-viewport {
  min-height: 100svh;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 12px;
  background: radial-gradient(
    ellipse at center,
    #24113f,
    #10071f 55%,
    #05030c
  );
}

.arcade-container {
  position: relative;
  width: min(100%, 900px, calc(100svh - 24px));
  aspect-ratio: 1 / 1;
  flex: 0 0 auto;
  border: 6px solid transparent;
  border-radius: 18px;
  overflow: hidden;
  background:
    linear-gradient(#080412, #080412) padding-box,
    linear-gradient(110deg, #28efff, #9f5fff, #ff71da, #fff3a1, #5fffe2, #7989ff, #28efff) border-box;
  background-size: 100% 100%, 100% 100%;
  box-shadow: 0 0 13px rgba(38, 235, 255, .65), 0 0 32px rgba(186, 77, 255, .4);
}

.game-container {
  position: relative;
  width: 100%;
  height: 100%;
  container-type: inline-size;
}

.machine {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.dispenser-container {
  position: absolute;
  left: 30.5%;
  top: 83.5%;
  width: 34%;
  height: 10.5%;
  pointer-events: none;
}

.buy-log {
  position: absolute; z-index: 4; left: 2%; bottom: 2%; width: 72%;
  height: 13%; overflow-y: auto; padding: 4px;
  border: 1px solid rgba(83,235,245,.85); border-radius: 6px;
  background: linear-gradient(110deg,rgba(5,12,28,.86),rgba(38,10,55,.86));
  color: #f4d5ff;
  box-shadow: 0 0 9px rgba(18,216,255,.48), inset 0 0 10px rgba(186,56,255,.3);
  font-size: clamp(6px, .72vw, 9px); line-height: 1.15;
  scrollbar-width: thin;
}
.buy-log-title {
  display: flex; align-items: center; justify-content: space-between; gap: 4px;
  color: #64ffcb; font-size: inherit; font-weight: bold; margin-bottom: 2px;
}
.buy-log-live { display: inline-flex; align-items: center; gap: 3px; color: #b2ffe6; }
.buy-log-dot {
  width: 5px; height: 5px; border-radius: 50%; background: #45ffb0;
  box-shadow: 0 0 5px #45ffb0;
}
.buy-log-entry {
  padding: 2px 0; border-top: 1px solid rgba(81,52,107,.4);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.buy-log.flash { animation: stickerBuyLogFlash 1.4s ease-out; }
.buy-log-entry.new { animation: stickerBuyLogNew 1.8s ease-out; }
@keyframes stickerBuyLogFlash {
  0%, 100% {
    border-color: rgba(83,235,245,.85);
    box-shadow: 0 0 9px rgba(18,216,255,.48), inset 0 0 10px rgba(186,56,255,.3);
  }
  15%, 50% {
    border-color: #fff4a3;
    box-shadow: 0 0 10px 4px #ffd85f, 0 0 25px #ff44ed, inset 0 0 20px #ffdc6488;
  }
  32%, 70% { border-color: #35d7ff; box-shadow: 0 0 13px #3cf2ff; }
}
@keyframes stickerBuyLogNew {
  0% { background: rgba(255,222,91,.9); color: #120a1b; }
  55% { background: rgba(255,222,91,.22); }
  100% { background: transparent; }
}
@media (prefers-reduced-motion: reduce) {
  .buy-log.flash, .buy-log-entry.new { animation: none; }
}

/* GLOBAL VOLUME CONTROL — available during capsule videos */
.app-volume {
  position: absolute;
  top: 36px;
  right: 8px;
  z-index: 60;
  display: flex;
  align-items: center;
  gap: 3px;
  width: 88px;
  padding: 2px 4px;
  border: 1px solid rgba(148,59,206,.4);
  border-radius: 6px;
  background: rgba(9,5,26,.3);
}
.app-volume button {
  border: 0;
  background: none;
  color: white;
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
  padding: 1px;
  flex: 0 0 auto;
}
.app-volume input {
  flex: 1 1 auto;
  width: 0;
  min-width: 0;
  height: 14px;
  accent-color: #64ffcb;
  cursor: pointer;
}

/* CAPSULE OPENING VIDEO */
.sticker-video-overlay {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  background: rgba(5, 2, 11, 0.94);
}
.sticker-video-overlay[hidden] { display: none; }
.sticker-video-overlay video {
  display: block;
  max-width: 100%;
  max-height: 92dvh;
  width: auto;
  height: auto;
  border-radius: 12px;
  object-fit: contain;
}

/* SOL PRICE LABELS */

.sol-price-tag,
.purchase-price-tag {
  position: absolute;
  z-index: 3;
  padding: 3px 6px;
  border: 1px solid #943bce;
  border-radius: 4px;
  background: rgba(9, 5, 26, 0.87);
  color: #64ffcb;
  font-size: 11px;
  font-weight: bold;
  line-height: 1.2;
  white-space: nowrap;
  pointer-events: none;
}

.sol-price-tag {
  top: 8px;
  right: 8px;
}

.purchase-price-tag {
  top: 8px;
  left: 8px;
}

/* CLICKABLE AREAS */

.hotspot {
  position: absolute;
  z-index: 2;
  border: none;
  padding: 0;
  background: transparent;
  cursor: pointer;
}

.hotspot:focus-visible,
.purchase-hotspot:focus-visible {
  outline: 2px solid white;
}

.pay-button {
  left: 77.5%;
  top: 27.5%;
  width: 14.3%;
  height: 23.4%;
}

.signin-button {
  left: 78.4%;
  top: 50.4%;
  width: 13%;
  height: 13.4%;
  overflow: hidden;
}

/* COLLECTION */

.collection-button {
  display: none;
  width: 100%;
  height: 100%;
  background: #090c32;
  border: 2px solid #527cff;
  border-radius: 10px;
  box-shadow: 0 0 10px #315dff;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 5px;
}

.signin-button.signed-in .collection-button {
  display: flex;
}

.collection-avatar {
  width: 48%;
  aspect-ratio: 1;
  border-radius: 50%;
  object-fit: cover;
  background: #29235d;
}

.collection-label {
  color: white;
  font-weight: bold;
  font-size: clamp(3px, 1cqw, 8px);
  text-shadow: 0 0 5px #527cff;
}

/* OVERLAYS */

.auth-overlay,
.purchase-overlay {
  position: fixed;
  inset: 0;
  align-items: center;
  justify-content: center;
  padding: 12px;
}

.auth-overlay {
  display: none;
  z-index: 20;
  background: rgba(5, 2, 11, 0.92);
}

.auth-overlay.open {
  display: flex;
}

.auth-panel {
  position: relative;
  width: min(420px, 95vw);
  padding: 30px;
  border: 2px solid #bd3aff;
  border-radius: 18px;
  background: #211035;
  text-align: center;
}

.auth-close {
  position: absolute;
  top: 8px;
  right: 14px;
  background: none;
  border: 0;
  color: white;
  font-size: 28px;
  cursor: pointer;
}

.auth-action {
  border: 0;
  border-radius: 10px;
  background: #d837f2;
  padding: 12px 22px;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.auth-action:disabled {
  opacity: 0.5;
}

#auth-status {
  font-size: 13px;
  overflow-wrap: anywhere;
}

/* CAPSULE MENU */

.purchase-overlay {
  display: flex;
  z-index: 15;
  background: rgba(5, 2, 11, 0.86);
}

.purchase-overlay[hidden],
.payment-panel[hidden] {
  display: none;
}

.purchase-modal {
  position: relative;
  width: min(94vw, 760px, 88svh);
  max-height: 88svh;
  border: 2px solid #bd3aff;
  border-radius: 14px;
  background: #080412;
  overflow: hidden;
  box-shadow: 0 0 35px #9b28e888;
}

.purchase-art {
  display: block;
  width: 100%;
  height: auto;
}

.purchase-hotspot {
  position: absolute;
  z-index: 2;
  border: 0;
  background: transparent;
  cursor: pointer;
}

.purchase-hotspot:disabled {
  cursor: wait;
}

.purchase-common {
  left: 13%;
  top: 65%;
  width: 21%;
  height: 11%;
}

.purchase-rare {
  left: 40%;
  top: 65%;
  width: 20%;
  height: 11%;
}

.purchase-legendary {
  left: 67%;
  top: 65%;
  width: 20%;
  height: 11%;
}

.purchase-close {
  right: 8.3%;
  top: 8.5%;
  width: 5%;
  height: 7%;
}

.purchase-status {
  position: absolute;
  left: 10%;
  bottom: 2%;
  width: 80%;
  margin: 0;
  color: white;
  font-size: clamp(9px, 1.4vw, 13px);
  text-align: center;
  text-shadow: 0 0 7px #bd3aff;
  overflow-wrap: anywhere;
  pointer-events: none;
}

/* SOLANA PAY PANEL */

.payment-panel {
  position: absolute;
  z-index: 5;
  inset: 4%;
  border: 2px solid #bd3aff;
  border-radius: 12px;
  padding: 12px;
  overflow-y: auto;
  background: rgba(9, 5, 22, 0.98);
  box-shadow: 0 0 25px #bd3aff77;
  text-align: center;
}

.payment-panel h2 {
  font-size: clamp(16px, 2.4vw, 23px);
  margin: 6px 0;
}

.payment-panel p {
  font-size: clamp(11px, 1.6vw, 14px);
  overflow-wrap: anywhere;
}

.payment-amount {
  font-size: clamp(16px, 3vw, 24px);
  font-weight: bold;
  color: #f6d2ff;
  overflow-wrap: anywhere;
}

#payment-qr {
  display: block;
  width: min(42%, 180px);
  height: auto;
  margin: 10px auto;
  padding: 7px;
  background: white;
  border-radius: 8px;
}

.payment-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
}

.payment-actions button,
.payment-actions a {
  display: inline-block;
  padding: 9px 12px;
  border: 0;
  border-radius: 7px;
  background: #ae2bdd;
  color: white;
  font-size: 12px;
  font-weight: bold;
  text-decoration: none;
  cursor: pointer;
}

.payment-actions .secondary {
  background: #383050;
}

#payment-message {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.payment-error {
  color: #ff9f9f;
}

/* MOBILE */

@media (max-width: 600px) {
  .arcade-viewport {
    padding: 4px;
  }

  .arcade-container {
    width: min(100%, calc(100svh - 8px));
    border-width: 4px;
    border-radius: 8px;
  }

  .app-volume {
    top: 25px;
    right: 4px;
    width: 74px;
    padding: 2px 3px;
    gap: 2px;
    border-radius: 5px;
  }

  .app-volume button {
    font-size: 12px;
    padding: 1px;
  }

  .buy-log {
    font-size: clamp(7px, 1.25vw, 9px);
  }

  .sol-price-tag,
  .purchase-price-tag {
    top: 4px;
    padding: 2px 4px;
    font-size: 8px;
  }

  .sol-price-tag {
    right: 4px;
  }

  .purchase-price-tag {
    left: 4px;
  }

  .collection-button {
    gap: 2px;
    padding: 2px;
    border-radius: 5px;
  }

  .purchase-overlay {
    padding: 5px;
  }

  .purchase-modal {
    width: min(98vw, 88svh);
    border-radius: 7px;
    border-width: 1px;
  }

  .purchase-status {
    font-size: 8px;
  }

  .payment-panel {
    padding: 7px;
  }

  #payment-qr {
    width: min(35%, 130px);
    margin: 5px auto;
  }

  .payment-actions button,
  .payment-actions a {
    font-size: 10px;
    padding: 6px;
  }
}
</style>
</head>

<body>

<!-- VENDING MACHINE -->

<main class="arcade-viewport">
  <div class="arcade-container">
    <div class="game-container" id="game-container">

      <img
        class="machine"
        src="assets/Neon%20Halloween%20Sticker%20Gacha%20Machine.png"
        alt="Sticker Mania Vending Machine"
      >

      <span
        class="sol-price-tag"
        id="sol-price-main"
        title="Current SOL price in USD">SOL LOADING...</span>

      <div class="app-volume" aria-label="App sound">
        <button type="button" id="app-volume-toggle" aria-label="Mute sound" title="Mute sound">🔊</button>
        <input id="app-volume-level" type="range" min="0" max="100" value="80" aria-label="Volume">
      </div>

      <div
        class="dispenser-container"
        id="dispenser-container">
      </div>

      <section class="buy-log" aria-label="Recent sticker purchases">
        <div class="buy-log-title"><span>RECENT BUYS</span><span class="buy-log-live"><span class="buy-log-dot"></span>LIVE</span></div>
        <div id="buy-log-items">No purchases yet</div>
      </section>

      <button
        class="hotspot pay-button"
        id="pay-button"
        aria-label="Buy capsules">
      </button>

      <button
        class="hotspot signin-button"
        id="signin-button"
        aria-label="Discord login or collection">

        <span class="collection-button">
          <img
            class="collection-avatar"
            id="collection-avatar"
            alt="Profile"
          >

          <span class="collection-label">
            MY COLLECTION
          </span>
        </span>

      </button>

    </div>
  </div>
</main>

<!-- CAPSULE OPENING ANIMATION -->
<div class="sticker-video-overlay" id="sticker-video-overlay" hidden>
  <video id="sticker-video"
    src="assets/Machines_sifting_as_lights_dance_20261011202211.mp4"
    playsinline preload="auto"></video>
</div>

<!-- CAPSULE PURCHASE MENU -->

<div
  class="purchase-overlay"
  id="purchase-overlay"
  hidden>

  <div
    class="purchase-modal"
    role="dialog"
    aria-modal="true"
    aria-label="Capsule purchase">

    <img
      class="purchase-art"
      src="assets/Neon%20Sticker%20Mania%20Pack%20Shop.png"
      alt="Select your capsule"
    >

    <span
      class="purchase-price-tag"
      id="sol-price-purchase"
      title="Current SOL price in USD">SOL LOADING...</span>

    <button
      class="purchase-hotspot purchase-common"
      data-tier="common"
      aria-label="Common Capsule $1">
    </button>

    <button
      class="purchase-hotspot purchase-rare"
      data-tier="rare"
      aria-label="Rare Capsule $3">
    </button>

    <button
      class="purchase-hotspot purchase-legendary"
      data-tier="legendary"
      aria-label="Legendary Capsule $5">
    </button>

    <button
      class="purchase-hotspot purchase-close"
      id="purchase-close"
      aria-label="Close">
    </button>

    <p
      class="purchase-status"
      id="purchase-status"
      role="status">
    </p>



  </div>
</div>

<!-- DISCORD SIGN IN -->

<div class="auth-overlay" id="auth-overlay">
  <div class="auth-panel">

    <button
      class="auth-close"
      id="auth-close"
      aria-label="Close">
      ×
    </button>

    <h2>SIGN IN</h2>

    <p>
      Sign in with Discord to access
      your Sticker Mania account.
    </p>

    <button
      class="auth-action"
      id="discord-auth">
      Continue with Discord
    </button>

    <p id="auth-status" role="status"></p>

  </div>
</div>


</body>
</html>
